<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Remindly — Notes, Tasks &amp; Calendar</title>
<meta name="description" content="Remindly — a calm, self-contained workspace for notes, tasks, projects and your calendar." />
<meta name="theme-color" content="#111111" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Remindly — monochrome design tokens (black & white only)
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-elev:#ffffff;
  --bg-sunken:#f3f3f3;
  --ink:#0a0a0a;
  --ink-2:#4c4c4c;
  --ink-3:#8c8c8c;
  --line:#e5e5e5;
  --line-strong:#c9c9c9;

  --accent:#0a0a0a;
  --accent-2:#2f2f2f;
  --accent-ink:#ffffff;
  --accent-soft:#eeeeee;

  --ok:#141414;
  --warn:#6e6e6e;
  --danger:#000000;
  --star:#8a8a8a;

  --r-xs:8px;
  --r-sm:12px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:30px;

  --sh-1:0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.05);
  --sh-2:0 2px 6px rgba(0,0,0,.07), 0 18px 40px rgba(0,0,0,.11);
  --sh-3:0 30px 80px rgba(0,0,0,.24);

  --font-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-display:'Fraunces','Inter',Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;

  --nav-w:264px;
  --top-h:64px;
}
html[data-theme="dark"]{
  --bg:#0b0b0b;
  --bg-elev:#151515;
  --bg-sunken:#1e1e1e;
  --ink:#f5f5f5;
  --ink-2:#b0b0b0;
  --ink-3:#7a7a7a;
  --line:#262626;
  --line-strong:#3a3a3a;
  --accent:#f5f5f5;
  --accent-2:#d6d6d6;
  --accent-ink:#0b0b0b;
  --accent-soft:#242424;
  --ok:#f5f5f5;
  --warn:#a0a0a0;
  --danger:#ffffff;
  --star:#9c9c9c;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 2px 8px rgba(0,0,0,.45), 0 20px 50px rgba(0,0,0,.55);
  --sh-3:0 30px 80px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em;
}
::selection{background:var(--ink);color:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);letter-spacing:-0.02em;line-height:1.12}
p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;
  padding:26px 18px calc(26px + env(safe-area-inset-bottom));
  border-right:1px solid var(--line);
  background:var(--bg-elev);
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{
  width:42px;height:42px;border-radius:14px;flex:none;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;
  box-shadow:0 10px 22px rgba(0,0,0,.18)
}
.brand-name{font-family:var(--font-display);font-size:21px;font-weight:700}
.brand-sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:1px}

.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 12px;margin-bottom:6px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:13px;
  color:var(--ink-2);font-size:14.2px;font-weight:550;width:100%;text-align:left;
  transition:background .16s ease, color .16s ease, transform .16s ease;
}
.nav-item:hover{background:var(--bg-sunken);color:var(--ink)}
.nav-item.is-active{background:var(--ink);color:var(--bg);box-shadow:0 10px 22px rgba(0,0,0,.18)}
.nav-item.is-active svg{opacity:1}
.nav-item svg{opacity:.82;flex:none}
.nav-count{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.mini-card{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--bg-elev);display:flex;flex-direction:column;gap:10px}
.mini-card h4{font-family:var(--font-ui);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.streak-row{display:flex;align-items:baseline;gap:8px}
.streak-num{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1}
.streak-cap{font-size:12px;color:var(--ink-2);line-height:1.35}

/* ---------- main column ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;height:var(--top-h);
  display:flex;align-items:center;gap:14px;
  padding:0 30px;border-bottom:1px solid var(--line);
  background:var(--bg);
}
.search-wrap{position:relative;flex:1;max-width:460px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-input{
  width:100%;height:42px;border-radius:14px;border:1px solid var(--line);
  background:var(--bg-elev);padding:0 14px 0 42px;font-size:14px;font-weight:500;
  transition:border-color .16s, box-shadow .16s;
}
.search-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--bg-elev);
  font-size:12.5px;font-weight:650;color:var(--ink-2);white-space:nowrap
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chip[data-state="live"] .dot{background:var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.chip[data-state="local"] .dot{background:var(--ink-3)}
.chip[data-state="offline"] .dot{background:transparent;border:2px solid var(--ink);width:10px;height:10px}
.icon-btn{
  width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--bg-elev);
  display:grid;place-items:center;color:var(--ink-2);transition:.16s
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}

.content{padding:30px;max-width:1180px;width:100%;margin:0 auto;flex:1}
.screen{display:none;animation:fade .28s ease both}
.screen.is-active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- headers & hero ---------- */
.page-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.page-title{font-size:38px;font-weight:700}
.page-sub{color:var(--ink-2);font-size:14.5px;margin-top:6px;max-width:56ch;line-height:1.55}
.page-head .spacer{margin-left:auto}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:750;margin-bottom:9px}

.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);
  padding:34px 36px;margin-bottom:26px;color:#fff;
  background:linear-gradient(122deg,#0a0a0a 0%,#1f1f1f 58%,#454545 100%);
  box-shadow:0 24px 54px rgba(0,0,0,.22);
}
.hero::after{
  content:"";position:absolute;right:-90px;top:-110px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 62%)
}
.hero-grid{position:absolute;inset:0;opacity:.14;
  background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 12% 20%, #000, transparent 72%)}
.hero h2{font-size:34px;font-weight:700;position:relative;max-width:17ch}
.hero p{margin-top:12px;font-size:15px;opacity:.92;max-width:46ch;line-height:1.6;position:relative}
.hero-actions{margin-top:22px;display:flex;gap:11px;flex-wrap:wrap;position:relative}
.hero-meta{position:relative;margin-top:22px;display:flex;gap:26px;flex-wrap:wrap}
.hero-meta div span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.78;font-weight:700}
.hero-meta div strong{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:44px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:650;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-1.5px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--ink);color:var(--bg);box-shadow:0 12px 26px rgba(0,0,0,.18)}
.btn-primary:hover{background:#000}
html[data-theme="dark"] .btn-primary:hover{background:#fff}
.btn-ghost{background:var(--bg-elev);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink);background:var(--bg-sunken)}
.btn-onhero{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.42)}
.btn-onhero:hover{background:rgba(255,255,255,.26)}
.btn-white{background:#fff;color:#0a0a0a}
.btn-danger{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn-danger:hover{background:var(--ink);color:var(--bg)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn-block{width:100%}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}

.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-head h3{font-size:19px;font-weight:650;font-family:var(--font-ui);letter-spacing:-0.015em}
.card-head .spacer{margin-left:auto}
.card-title-lg{font-family:var(--font-display);font-size:23px;font-weight:650}

.section-head{display:flex;align-items:center;gap:12px;margin:30px 0 16px}
.section-head h3{font-family:var(--font-display);font-size:24px;font-weight:650}
.section-head .spacer{margin-left:auto}

.stat-tile{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden
}
.stat-tile .lab{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat-tile .val{font-family:var(--font-display);font-size:36px;font-weight:700;line-height:1}
.stat-tile .foot{font-size:12px;color:var(--ink-2);line-height:1.45}
.stat-ico{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink)}

/* ---------- progress ---------- */
.bar{height:9px;border-radius:999px;background:var(--bg-sunken);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--ink);transition:width .5s ease}
.bar.mid > i{background:#7a7a7a}
.bar.light > i{background:#b4b4b4}

/* ---------- task rows ---------- */
.task{
  display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:15px;
  border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s;cursor:pointer
}
.task:hover{background:var(--bg-sunken);border-color:var(--line);transform:translateX(2px)}
.task.is-done .task-title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.task.is-done .task-meta{opacity:.6}
.check{
  width:22px;height:22px;border-radius:8px;border:2px solid var(--line-strong);flex:none;
  display:grid;place-items:center;color:#fff;transition:.16s;background:transparent
}
.check:hover{border-color:var(--ink)}
.check.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.task-main{min-width:0;flex:1}
.task-title{font-size:14.3px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{display:flex;align-items:center;gap:9px;margin-top:5px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:650;background:var(--bg-sunken);color:var(--ink-2);border:1px solid var(--line)
}
.pill.accent{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.ok{background:transparent;color:var(--ink);border-color:var(--ink)}
.pill.warn{background:var(--accent-soft);color:var(--ink-2)}
.pill.danger{background:transparent;color:var(--ink);border:1px dashed var(--ink)}
.pill.mono{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em}
.priority-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink)}
.priority-dot.hollow{background:transparent;border:2px solid var(--ink-3)}
.priority-dot.mid{background:var(--ink-3)}

/* ---------- note cards ---------- */
.note{
  border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;background:var(--bg-elev);
  display:flex;flex-direction:column;gap:10px;min-height:172px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease
}
.note:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--ink)}
.note::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--note-ink,var(--ink))}
.note h4{font-family:var(--font-ui);font-size:15px;font-weight:650;letter-spacing:-0.012em;line-height:1.35}
.note .excerpt{font-size:13px;color:var(--ink-2);line-height:1.6;flex:1;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.note-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note-foot .when{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- project cards ---------- */
.project{
  border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;background:var(--bg-elev);
  display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.18s
}
.project:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--ink)}
.project-top{display:flex;align-items:flex-start;gap:12px}
.project-swatch{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
.project h4{font-family:var(--font-ui);font-size:15.5px;font-weight:680}
.project .desc{font-size:12.8px;color:var(--ink-2);line-height:1.55;margin-top:3px}
.pct{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.cal-title{font-family:var(--font-display);font-size:27px;font-weight:650;min-width:210px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-dow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:750;text-align:center;padding-bottom:4px}
.cal-day{
  min-height:104px;border:1px solid var(--line);border-radius:14px;padding:9px;background:var(--bg-elev);
  display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.15s;position:relative
}
.cal-day:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh-1)}
.cal-day.is-out{opacity:.38;background:transparent}
.cal-day.is-today{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.cal-num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-day.is-today .cal-num{
  background:var(--ink);color:var(--bg);width:24px;height:24px;border-radius:8px;display:grid;place-items:center
}
.cal-ev{
  font-size:10.6px;font-weight:650;line-height:1.25;padding:4px 7px;border-radius:7px;
  background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.cal-more{font-size:10px;color:var(--ink-3);font-weight:650}
.event-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;transition:.15s;cursor:pointer}
.event-row:hover{background:var(--bg-sunken)}
.ev-time{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);width:56px;flex:none}
.ev-bar{width:4px;align-self:stretch;border-radius:999px;background:var(--ink)}
.ev-title{font-size:13.8px;font-weight:620}
.ev-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* ---------- search ---------- */
.result-group{margin-bottom:22px}
.result-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.result-head h4{font-family:var(--font-ui);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:750}
mark{background:var(--ink);color:var(--bg);border-radius:4px;padding:0 3px}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lab{font-size:14px;font-weight:620}
.set-row .hint{font-size:12.2px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.set-row .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.switch{width:52px;height:29px;border-radius:999px;background:var(--line-strong);position:relative;transition:.2s;flex:none}
.switch.is-on{background:var(--ink)}
.switch i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch.is-on i{left:26px}
.swatches{display:flex;gap:8px}
.swatch{width:26px;height:26px;border-radius:9px;border:1px solid var(--line-strong)}

/* ---------- charts ---------- */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{position:relative;width:168px;height:168px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .mid b{font-family:var(--font-display);font-size:33px;font-weight:700;line-height:1}
.donut .mid span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:750;display:block;margin-top:3px}
.legend{display:flex;flex-direction:column;gap:11px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);font-weight:560}
.legend i{width:11px;height:11px;border-radius:4px;flex:none;background:var(--ink)}
.legend i.hollow{background:transparent;border:1.5px solid var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars .b .stem{width:100%;border-radius:8px 8px 4px 4px;background:var(--ink);transition:height .5s ease}
.bars .b .d{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.08em}

/* ---------- modal / sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:200
}
.scrim.is-open{display:flex;animation:fade .2s ease both}
.modal{
  width:min(620px,100%);max-height:88vh;overflow:auto;border-radius:var(--r-xl);
  background:var(--bg-elev);box-shadow:var(--sh-3);border:1px solid var(--line);
  animation:pop .26s cubic-bezier(.2,.8,.3,1) both
}
.modal.wide{width:min(860px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:14px;padding:22px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-elev);z-index:2}
.modal-head h3{font-family:var(--font-display);font-size:22px;font-weight:650}
.modal-body{padding:24px 26px}
.modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:11px;align-items:center;background:var(--bg-elev);position:sticky;bottom:0}
.modal-foot .spacer{margin-left:auto}

.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:750;color:var(--ink-3);margin-bottom:8px}
.input,.textarea,.select{
  width:100%;border:1px solid var(--line);border-radius:13px;background:var(--bg-sunken);
  padding:12px 14px;font-size:14px;font-weight:500;transition:.16s
}
.textarea{min-height:132px;resize:vertical;line-height:1.65;font-family:var(--font-ui)}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--ink);background:var(--bg-elev);box-shadow:0 0 0 4px var(--accent-soft)}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chip-pick{display:flex;gap:8px;flex-wrap:wrap}
.chip-pick button{
  height:33px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-sunken);
  font-size:12.3px;font-weight:640;color:var(--ink-2);transition:.15s
}
.chip-pick button.is-on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-pick button:hover{transform:translateY(-1px)}

/* ---------- toast ---------- */
.toast-zone{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(520px,92vw)}
.toast{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:15px;
  background:var(--ink);color:var(--bg);box-shadow:var(--sh-2);font-size:13.4px;font-weight:560;
  animation:toastIn .28s cubic-bezier(.2,.8,.3,1) both
}
.toast button{color:inherit;font-weight:750;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.92;text-decoration:underline}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:26px;bottom:26px;width:60px;height:60px;border-radius:20px;z-index:120;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;
  box-shadow:0 18px 38px rgba(0,0,0,.28);transition:.18s
}
.fab:hover{transform:translateY(-3px) scale(1.03)}
.fab-tip{
  position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);
  background:var(--bg);color:var(--ink);border:1px solid var(--ink);font-size:11.5px;font-weight:680;letter-spacing:.03em;
  padding:7px 11px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s
}
.fab:hover .fab-tip{opacity:1}

/* ---------- focus timer ---------- */
.focus-ring{width:220px;height:220px;margin:6px auto 20px;position:relative}
.focus-ring svg{transform:rotate(-90deg)}
.focus-ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.focus-ring .mid b{font-family:var(--font-mono);font-size:44px;font-weight:500;letter-spacing:-0.03em}
.focus-ring .mid span{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:750;margin-top:4px}

/* ---------- empty state ---------- */
.empty{
  text-align:center;padding:52px 26px;border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);
  background:var(--bg-elev)
}
.empty .ico{width:56px;height:56px;border-radius:18px;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;margin:0 auto 16px}
.empty h4{font-family:var(--font-display);font-size:21px;font-weight:650;margin-bottom:8px}
.empty p{font-size:13.5px;color:var(--ink-2);line-height:1.65;max-width:40ch;margin:0 auto 18px}

/* ---------- auth ---------- */
.auth-tabs{display:flex;gap:8px;padding:5px;background:var(--bg-sunken);border-radius:14px;margin-bottom:22px}
.auth-tabs button{flex:1;height:38px;border-radius:11px;font-size:13.2px;font-weight:650;color:var(--ink-2);transition:.15s}
.auth-tabs button.is-on{background:var(--bg-elev);color:var(--ink);box-shadow:var(--sh-1);border:1px solid var(--ink)}
.notice{
  display:flex;gap:11px;padding:13px 15px;border-radius:14px;font-size:12.6px;line-height:1.6;
  background:var(--accent-soft);color:var(--ink);border:1px solid var(--line-strong)
}
.notice.warn{background:transparent;border-style:dashed}
.notice.danger{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice svg{flex:none;margin-top:1px}

/* ---------- detail pane ---------- */
.detail-hero{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px}
.kv{display:grid;grid-template-columns:132px 1fr;gap:12px 16px;font-size:13.4px;align-items:center}
.kv dt{color:var(--ink-3);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:750}
.kv dd{margin:0;font-weight:560}
.divider{height:1px;background:var(--line);margin:20px 0}

/* ---------- mobile ---------- */
.mobile-bar{display:none}
@media (max-width:1080px){
  .split{grid-template-columns:1fr}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:20px 16px 116px}
  .topbar{padding:0 16px;gap:10px}
  .page-title{font-size:29px}
  .hero{padding:26px 22px;border-radius:24px}
  .hero h2{font-size:25px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .cal-day{min-height:74px;padding:6px}
  .cal-ev{font-size:9.4px;padding:3px 5px}
  .mobile-bar{
    display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:150;
    background:var(--bg-elev);border:1px solid var(--line);
    border-radius:22px;padding:8px;gap:4px;box-shadow:var(--sh-2)
  }
  .mobile-bar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:15px;
    font-size:9.6px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase
  }
  .mobile-bar button.is-active{background:var(--ink);color:var(--bg)}
  .fab{bottom:calc(96px + env(safe-area-inset-bottom));right:18px;width:54px;height:54px;border-radius:18px}
  .field-2,.field-3{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
}
@media print{
  .sidebar,.topbar,.fab,.mobile-bar,.toast-zone{display:none !important}
  .app{grid-template-columns:1fr}
  body{background:#fff}
  .card,.note,.project{box-shadow:none;break-inside:avoid}
}
</style>

(function () {

    var c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    var x = c.getContext('2d');
    x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = '#ffffff';
    x.beginPath(); x.arc(256, 214, 96, 0, Math.PI * 2); x.fill();
    x.fillRect(214, 300, 84, 116);
    x.fillRect(196, 416, 120, 26);
    return c.toDataURL('image/png');
  }
  try {

      name: 'Remindly — Notes, Tasks & Calendar',

      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var link = document.createElement('link');
    link.rel = 'manifest';

<script>
/* =========================================================
   0. CONFIG — Supabase
   ========================================================= */
const SUPABASE_URL = "https://xpugrxvgprxdipetjefa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vqWWJ36MCIOrWKn_euMJzg_HWwKPXnV";

/* =========================================================
   1. Minimal Supabase REST client (fetch-based)
   ========================================================= */
function createSupabaseDb(url, key) {
  let sessionToken = null;
  const headers = () => ({
    apikey: key,
    Authorization: "Bearer " + (sessionToken || key),
    "Content-Type": "application/json"
  });
  const rest = (path, opts = {}) =>
    fetch(url + path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } })
      .then(async (r) => {
        const text = await r.text();
        const data = text ? JSON.parse(text) : null;
        if (!r.ok) {
          const err = new Error(data?.message || data?.msg || r.statusText);
          err.data = data; err.status = r.status; throw err;
        }
        return data;
      });

  return {
    get session() { return sessionToken ? { access_token: sessionToken } : null; },
    setSession(t) { sessionToken = t; },

    select(table, { filter = {}, order = null, limit = null, columns = "*" } = {}) {
      let q = `rest/v1/${table}?select=${encodeURIComponent(columns)}`;
      for (const [k, v] of Object.entries(filter)) q += `&${k}=eq.${encodeURIComponent(v)}`;
      if (order) q += `&order=${order}`;
      if (limit) q += `&limit=${limit}`;
      return rest(q, { method: "GET" });
    },

    insert(table, rows, { returning = true } = {}) {
      return rest(`rest/v1/${table}`, {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=" + (returning ? "representation" : "minimal") },
        body: JSON.stringify(rows),
      });
    },

    update(table, id, patch) {
      return rest(`rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify(patch),
      });
    },

    remove(table, id) {
      return rest(`rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: { Prefer: "return=minimal" },
      });
    },

    signIn(email, password) {
      return rest("auth/v1/token?grant_type=password", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      }).then((r) => { sessionToken = r.access_token; return r; });
    },

    signUp(email, password) {
      return rest("auth/v1/signup", {
        method: "POST",
        body: JSON.stringify({ email, password }),
      });
    },

    getUser() {
      if (!sessionToken) return Promise.resolve(null);
      return rest("auth/v1/user", { method: "GET" }).catch(() => null);
    },

    signOut() { sessionToken = null; return Promise.resolve(true); },
    onAuthChange() { return () => {}; },
  };
}

const CONFIGURED =
  typeof SUPABASE_URL === "string" && SUPABASE_URL.startsWith("https://") &&
  typeof SUPABASE_ANON_KEY === "string" && SUPABASE_ANON_KEY.length > 20 &&
  !/YOUR_|<|>/.test(SUPABASE_URL + SUPABASE_ANON_KEY);

const db = CONFIGURED ? createSupabaseDb(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* =========================================================
   2. Utilities
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const uid = () => "id_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function esc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function todayISO(d = new Date()) {
  return `{d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDaysISO(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return todayISO(d);
}
function fmtDate(iso, opts = { month: "short", day: "numeric" }) {
  if (!iso) return "—";
  return new Date(iso + "T00:00:00").toLocaleDateString(undefined, opts);
}
function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " +
         d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function timeAgo(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 604800) return Math.floor(s / 86400) + "d ago";
  return fmtDate(iso.slice(0, 10), { month: "short", day: "numeric", year: "numeric" });
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* =========================================================

const ICON_PATHS = {
  home: '<path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',

const state = {
  view: "home",
  detail: null,
  search: "",
  calendarMonth: new Date().getMonth(),
  calendarYear: new Date().getFullYear(),
  taskFilter: "all",
  noteFilter: "all",

  mode: CONFIGURED ? "local" : "demo",
  authError: "",
  authTab: "signin",
  editing: null,
  pendingConfirm: null,
  projects: [],
  tasks: [],
  notes: [],
  events: [],
  outbox: [],
  lastSync: null,
};

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      projects: state.projects, tasks: state.tasks, notes: state.notes, events: state.events,
      outbox: state.outbox, lastSync: state.lastSync,
    }));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.projects = d.projects || [];
    state.tasks = d.tasks || [];
    state.notes = d.notes || [];
    state.events = d.events || [];
    state.outbox = d.outbox || [];
    state.lastSync = d.lastSync || null;
    return true;
  } catch (e) { return false; }
}

/* =========================================================
   5. IndexedDB outbox
   ========================================================= */
let idb = null;
function openIDB() {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open("remindly", 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      };
      req.onsuccess = () => { idb = req.result; resolve(true); };
      req.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}
function idbSet(key, value) {
  return new Promise((resolve) => {
    if (!idb) return resolve(false);
    try {
      const tx = idb.transaction("kv", "readwrite");
      tx.objectStore("kv").put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}
function idbGet(key) {
  return new Promise((resolve) => {
    if (!idb) return resolve(null);
    try {
      const tx = idb.transaction("kv", "readonly");
      const r = tx.objectStore("kv").get(key);
      r.onsuccess = () => resolve(r.result ?? null);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

/* =========================================================
   7. Sync engine
   ========================================================= */
function setSyncChip() {
  const chip = $("#sync-chip");
  const text = $("#sync-chip-text");
  const detail = $("#sync-detail");
  if (!navigator.onLine) {
    chip.dataset.state = "offline";
    text.textContent = "Offline";
    detail.innerHTML = "You're offline. Everything is saved on this device and will sync automatically when you reconnect.";
    return;
  }
  if (state.mode === "live") {
    chip.dataset.state = "live";
    text.textContent = "Live";
    detail.innerHTML = `Synced to Supabase as <strong>${esc(state.user?.email || "your account")}</strong>.<br />Last sync ${state.lastSync ? esc(timeAgo(state.lastSync)) : "just now"}.`;
    return;
  }
  chip.dataset.state = "local";
  text.textContent = CONFIGURED ? "Ready (local)" : "Demo mode";
  detail.innerHTML = CONFIGURED
    ? "Everything is saved on this device. Sign in to sync across your devices."
    : "Supabase isn't configured yet. Add your Project URL and anon key at the top of the script to switch to live sync.";
}

const COLLECTION_TABLE = { projects: "projects", tasks: "tasks", notes: "notes", events: "events" };

async function pushOutbox() {
  if (!db || state.mode !== "live" || !state.outbox.length) return;
  const queue = state.outbox.slice();
  for (const op of queue) {
    try {
      const table = COLLECTION_TABLE[op.collection];
      if (op.kind === "upsert") await db.insert(table, [{ ...op.record, user_id: state.user.id }]);
      if (op.kind === "delete") await db.remove(table, op.id);
      state.outbox = state.outbox.filter((o) => o.key !== op.key);
    } catch (e) {}
  }
  save();
  idbSet("outbox", state.outbox);
}

async function pullRemote() {
  if (!db || state.mode !== "live") return;
  for (const [key, table] of Object.entries(COLLECTION_TABLE)) {
    try {
      const rows = await db.select(table, { filter: { user_id: state.user.id } });
      if (Array.isArray(rows)) {
        const localIds = new Set(state[key].map((r) => r.id));
        for (const row of rows) {
          const idx = state[key].findIndex((r) => r.id === row.id);
          if (idx >= 0) state[key][idx] = { ...state[key][idx], ...row };
          else state[key].push(row);
          localIds.delete(row.id);
        }
        for (const id of localIds) {
          const pending = state.outbox.some((o) => o.id === id);
          if (!pending) state[key] = state[key].filter((r) => r.id !== id);
        }
      }
    } catch (e) {}
  }
  state.lastSync = new Date().toISOString();
  save();
}

async function syncNow({ silent = true } = {}) {
  if (!navigator.onLine) {
    setSyncChip();
    if (!silent) toast("You're offline — changes are queued locally.", "wifiOff");
    return;
  }
  await pushOutbox();
  await pullRemote();
  setSyncChip();
  render();
  if (!silent) toast("Sync complete.", "check");
}

function queueOp(kind, collection, record) {
  const key = uid();
  state.outbox.push({ key, kind, collection, id: record.id, record });
  idbSet("outbox", state.outbox);
}

function stamp(obj) {
  const now = new Date().toISOString();
  return { ...obj, updated_at: now, created_at: obj.created_at || now, user_id: state.user?.id || "local" };
}

/* =========================================================
   8. CRUD
   ========================================================= */
function createItem(collection, record) {
  const row = stamp({ id: record.id || uid(), ...record });
  state[collection].unshift(row);
  queueOp("upsert", collection, row);
  save();
  if (state.mode === "live") syncNow();
  return row;
}

function updateItem(collection, id, patch) {
  const idx = state[collection].findIndex((r) => r.id === id);
  if (idx < 0) return null;
  const row = stamp({ ...state[collection][idx], ...patch, id });
  state[collection][idx] = row;
  queueOp("upsert", collection, row);
  save();
  if (state.mode === "live") syncNow();
  return row;
}

function deleteItem(collection, id) {
  const removed = state[collection].find((r) => r.id === id);
  state[collection] = state[collection].filter((r) => r.id !== id);
  if (collection === "projects") {
    state.tasks = state.tasks.map((t) => (t.project_id === id ? { ...t, project_id: null } : t));
    state.notes = state.notes.map((n) => (n.project_id === id ? { ...n, project_id: null } : n));
    state.events = state.events.map((e) => (e.project_id === id ? { ...e, project_id: null } : e));
  }
  queueOp("delete", collection, { id });
  save();
  if (state.mode === "live") syncNow();
  return removed;
}

function toggleTaskDone(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const wasDone = !!t.done;
  updateItem("tasks", id, { done: !wasDone, completed_at: !wasDone ? new Date().toISOString() : null });
  if (!wasDone) {
    toast("Task completed.", "check", {
      label: "Undo",
      fn: () => { updateItem("tasks", id, { done: false, completed_at: null }); render(); },
    });
  }
  render();
}

/* =========================================================
   9. Derived data
   ========================================================= */
const projectById = (id) => state.projects.find((p) => p.id === id) || null;
const taskById = (id) => state.tasks.find((t) => t.id === id) || null;
const noteById = (id) => state.notes.find((n) => n.id === id) || null;
const eventById = (id) => state.events.find((e) => e.id === id) || null;

function projectProgress(pid) {
  const all = state.tasks.filter((t) => t.project_id === pid);
  const done = all.filter((t) => t.done).length;
  return { total: all.length, done, pct: all.length ? Math.round((done / all.length) * 100) : 0 };
}

function dueBucket(iso) {
  const t = todayISO();
  if (!iso) return "none";
  if (iso === t) return "today";
  if (iso < t) return "overdue";
  return "upcoming";
}

function weekStats() {
  const now = new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const iso = todayISO(d);
    days.push({
      iso,
      label: DAYS[d.getDay()].slice(0, 1),
      done: state.tasks.filter((t) => t.done && t.completed_at && todayISO(new Date(t.completed_at)) === iso).length,
    });
  }
  const doneThisWeek = days.reduce((a, b) => a + b.done, 0);
  const totalDone = state.tasks.filter((t) => t.done).length;
  const totalTasks = state.tasks.length;
  const openNotes = state.notes.length;
  const upcoming = state.events.filter((e) => e.date >= todayISO()).length;
  return { days, doneThisWeek, totalDone, totalTasks, openNotes, upcoming };
}

function matchesSearch(q, ...fields) {
  if (!q) return true;
  const needle = q.toLowerCase();
  return fields.some((f) => String(f ?? "").toLowerCase().includes(needle));
}

function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  try {
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return safe.replace(re, "<mark>$1</mark>");
  } catch (e) { return safe; }
}

/* =========================================================
   10. Toast
   ========================================================= */
function toast(message, iconName = "info", action) {
  const zone = $("#toast-zone");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${icon(iconName, 17)}<span>${esc(message)}</span>`;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.addEventListener("click", () => { action.fn(); el.remove(); });
    el.appendChild(b);
  }
  zone.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(10px)"; setTimeout(() => el.remove(), 220); }, action ? 5200 : 3000);
}

function bindChipPick(sel) {
  const wrap = $(sel);
  if (!wrap) return;
  wrap.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-val]");
    if (!b) return;
    $$$$("button", wrap).forEach((x) => x.classList.remove("is-on"));
    b.classList.add("is-on");
  });
}
function bindSwitch(sel) {
  const el = $(sel);
  if (!el) return;
  el.addEventListener("click", () => el.classList.toggle("is-on"));
}
function chipVal(sel) {
  const b = $(sel + " button.is-on");
  return b ? b.dataset.val : null;
}

function collectEditor() {
  const t = state.editing.type;
  const get = (id) => { const el = $("#" + id); return el ? el.value : ""; };
  const isOn = (id) => { const el = $("#" + id); return el ? el.classList.contains("is-on") : false; };

  if (t === "task") {
    return {
      title: get("f-title").trim() || "Untitled task",
      due_date: get("f-due") || null,
      priority: chipVal("#f-priority") || "medium",
      recurrence: chipVal("#f-recurrence") || "none",
      project_id: get("f-project") || null,
      notes: get("f-notes"),
      starred: isOn("#f-starred"),
    };
  }
  if (t === "note") {
    return {
      title: get("f-title").trim() || "Untitled note",
      body: get("f-notes"),
      tags: get("f-tags").split(",").map((s) => s.trim()).filter(Boolean),
      project_id: get("f-project") || null,
      color: chipVal("#f-tone") || GREYS[0],
      pinned: isOn("#f-pinned"),
    };
  }
  if (t === "event") {
    return {
      title: get("f-title").trim() || "Untitled event",
      date: get("f-date") || todayISO(),
      start_time: get("f-start") || null,
      end_time: get("f-end") || null,
      location: get("f-location"),
      project_id: get("f-project") || null,
      notes: get("f-notes"),
    };
  }
  if (t === "project") {
    return {
      name: get("f-title").trim() || "Untitled project",
      description: get("f-notes"),
      due_date: get("f-due") || null,
      color: chipVal("#f-color") || GREYS[0],
    };
  }
  return {};
}

function collectionOf(type) {
  return type === "task" ? "tasks" : type === "note" ? "notes" : type === "event" ? "events" : "projects";
}

function saveEditor() {
  const { type, id } = state.editing;
  const patch = collectEditor();
  const collection = collectionOf(type);
  if (id) {
    updateItem(collection, id, patch);
    toast("Saved.", "check");
  } else {
    const row = createItem(collection, patch);
    toast("Created.", "sparkle");
    state.detail = { type, id: row.id };
  }
  closeModal();
  render();
}

function deleteFromEditor() {
  const { type, id } = state.editing;
  if (!id) return;
  const collection = collectionOf(type);
  confirmAction(
    "Delete this " + type + "?",
    "This can't be undone once it has synced to your account.",
    "Yes, delete",
    () => {
      deleteItem(collection, id);
      closeModal();
      if (state.detail && state.detail.id === id) { state.detail = null; state.view = "home"; }
      render();
      toast("Deleted.", "trash");
    }
  );
}

async function authSubmit() {
  const email = ($("#auth-email")?.value || "").trim();
  const password = $("#auth-password")?.value || "";
  const isSignUp = state.authTab === "signup";
  state.authError = "";

  if (!email || !email.includes("@")) { state.authError = "Please enter a valid email address."; return renderAuth(); }
  if (password.length < 8) { state.authError = "Password needs to be at least 8 characters."; return renderAuth(); }
  if (isSignUp && password !== ($("#auth-password2")?.value || "")) {
    state.authError = "Those passwords don't match."; return renderAuth();
  }

  try {
    if (isSignUp) {
      const r = await db.signUp(email, password);
      if (r?.access_token) {
        db.setSession(r.access_token);
        await onSignedIn(r.user || { id: r.id, email });
      } else {
        state.authError = "Almost there — check your inbox to confirm your email, then sign in.";
        state.authTab = "signin";
      }
    } else {
      const r = await db.signIn(email, password);
      await onSignedIn(r.user || { id: r.id, email });
    }
  } catch (e) {
    state.authError = e?.data?.error_description || e?.data?.msg || e.message || "Something went wrong.";
  }
  renderAuth();
}

async function onSignedIn(user) {
  state.user = user;
  state.mode = "live";
  state.authError = "";
  await syncNow({ silent: true });
  closeModal();
  toast("You're signed in. Sync is live.", "cloud");
  render();
}

async function signOut() {
  if (db) await db.signOut();
  state.user = null;
  state.mode = CONFIGURED ? "local" : "demo";
  closeModal();
  toast("Signed out. Your local copy is still here.", "logout");
  render();
}

/* =========================================================
   14. Focus timer
   ========================================================= */
const focus = { total: 25 * 60, left: 25 * 60, running: false, tick: null, mode: 25 };

function openFocus() { renderFocus(); openModal("modal-focus"); }

function renderFocus() {
  const pct = 1 - focus.left / focus.total;
  const R = 96, C = 2 * Math.PI * R;
  const mm = String(Math.floor(focus.left / 60)).padStart(2, "0");
  const ss = String(focus.left % 60).padStart(2, "0");
  $("#focus-body").innerHTML = `
    <div class="focus-ring">
      <svg width="220" height="220">
        <circle cx="110" cy="110" r="${R}" stroke="var(--bg-sunken)" stroke-width="14" fill="none" />
        <circle cx="110" cy="110" r="${R}" stroke="var(--ink)" stroke-width="14" fill="none"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" />
      </svg>
      <div class="mid">
        <div>
          <b>${mm}:${ss}</b>
          <span>${focus.mode === 25 ? "Focus" : focus.mode === 5 ? "Short break" : "Long break"}</span>
        </div>
      </div>
    </div>
    <div class="chip-pick" id="focus-presets" style="justify-content:center">
      ${[[25, "Focus 25"], [5, "Break 5"], [15, "Break 15"], [50, "Deep 50"]].map(([m, l]) =>
        `<button type="button" data-val="${m}" class="${focus.mode === m ? "is-on" : ""}">${l}</button>`).join("")}
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap">
      <button class="btn btn-primary" data-act="focus-toggle">
        ${icon(focus.running ? "pause" : "play", 17)} ${focus.running ? "Pause" : "Start"}
      </button>
      <button class="btn btn-ghost" data-act="focus-reset">${icon("refresh", 17)} Reset</button>
    </div>
    <p style="text-align:center;font-size:12px;color:var(--ink-3);margin-top:18px;line-height:1.7">
      A single-task timer. When it ends, stand up, look at something far away, and come back.
    </p>`;
  bindChipPick("#focus-presets");
  $("#focus-presets").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-val]");
    if (!b) return;
    focus.mode = +b.dataset.val;
    focus.total = focus.mode * 60;
    focus.left = focus.total;
    clearInterval(focus.tick); focus.running = false;
    renderFocus();
  });
}

function focusToggle() {
  if (focus.running) {
    clearInterval(focus.tick); focus.running = false;
  } else {
    focus.running = true;
    focus.tick = setInterval(() => {
      focus.left--;
      if (focus.left <= 0) {
        clearInterval(focus.tick); focus.running = false; focus.left = 0;
        toast("Session complete. Nice work.", "star");
        try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
      }
      renderFocus();
    }, 1000);
  }
  renderFocus();
}

function taskRowHTML(t) {
  const p = projectById(t.project_id);
  const bucket = dueBucket(t.due_date);
  const bucketPill = bucket === "overdue"
    ? `<span class="pill danger">${icon("alert", 11)} Overdue</span>`
    : bucket === "today"
      ? `<span class="pill accent">${icon("clock", 11)} Today</span>`
      : t.due_date
        ? `<span class="pill">${esc(fmtDate(t.due_date, { month: "short", day: "numeric" }))}</span>`
        : "";
  const priClass = { high: "", medium: "mid", low: "hollow" }[t.priority] || "hollow";
  return `
    <div class="task ${t.done ? "is-done" : ""}" data-act="open-detail" data-type="task" data-id="${t.id}">
      <button class="check ${t.done ? "is-on" : ""}" data-act="toggle-task" data-id="${t.id}" aria-label="Toggle complete">
        ${t.done ? icon("check", 13, 3) : ""}
      </button>
      <div class="task-main">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="priority-dot ${priClass}"></span>
          ${bucketPill}
          ${p ? `<span class="pill">${icon("briefcase", 11)} ${esc(p.name)}</span>` : ""}
          ${t.recurrence && t.recurrence !== "none" ? `<span class="pill">${icon("repeat", 11)} ${esc(t.recurrence)}</span>` : ""}
          ${t.starred ? `<span class="pill warn">${icon("star", 11)}</span>` : ""}
        </div>
      </div>
    </div>`;
}

function noteCardHTML(n) {

function renderCalendar() {
  const y = state.calendarYear, m = state.calendarMonth;
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const t = todayISO();

  const cells = [];
  for (let i = 0; i < startDow; i++) {
    cells.push({ num: prevDays - startDow + i + 1, out: true, iso: addDaysISO(todayISO(new Date(y, m, 1)), -(startDow - i)) });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ num: d, out: false, iso: `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}` });
  }
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length - 1];
    cells.push({ num: cells.length - startDow - daysInMonth + 1, out: true, iso: addDaysISO(last.iso, 1) });
  }

  const monthEvents = state.events
    .filter((e) => e.date && e.date.startsWith(`${y}-${String(m + 1).padStart(2, "0")}`))
    .sort((a, b) => (a.date + (a.start_time || "")).localeCompare(b.date + (b.start_time || "")));

  $("#screen-calendar").innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Schedule</div>
        <h2 class="page-title">Calendar</h2>
        <p class="page-sub">${monthEvents.length} event${monthEvents.length === 1 ? "" : "s"} this month. Click any day to add something.</p>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" data-act="new" data-type="event">${icon("plus", 17)} New event</button>
    </div>

    <div class="card">
      <div class="cal-head">
        <div class="cal-title">${MONTHS[m]} ${y}</div>
        <button class="icon-btn" data-act="cal-prev" aria-label="Previous month">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="icon-btn" data-act="cal-next" aria-label="Next month">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" data-act="cal-today">Today</button>
      </div>

      <div class="cal-grid">
        ${DAYS.map((d) => `<div class="cal-dow">${d.slice(0, 3)}</div>`).join("")}
        ${cells.map((c) => {
          const evs = state.events.filter((e) => e.date === c.iso).sort((a, b) => (a.start_time || "").localeCompare(b.start_time || ""));
          return `
            <div class="cal-day ${c.out ? "is-out" : ""} ${c.iso === t ? "is-today" : ""}" data-act="cal-day" data-date="${c.iso}">
              <div class="cal-num">${c.num}</div>
              ${evs.slice(0, 2).map((e) => `<div class="cal-ev" data-act="open-detail" data-type="event" data-id="${e.id}">${esc(e.start_time || "")} ${esc(e.title)}</div>`).join("")}
              ${evs.length > 2 ? `<div class="cal-more">+${evs.length - 2} more</div>` : ""}
            </div>`;
        }).join("")}
      </div>
    </div>

    <div class="section-head"><h3>Everything this month</h3></div>
    <div class="card">
      ${monthEvents.length ? monthEvents.map(eventRowHTML).join("") : emptyHTML("calendar", "A quiet month", "Nothing scheduled here yet.", "Add an event", "event")}
    </div>`;
}

function renderTasks() {
  const t = todayISO();
  const filters = [
    ["all", "All"], ["today", "Today"], ["upcoming", "Upcoming"], ["overdue", "Overdue"], ["starred", "Starred"], ["done", "Completed"],
  ];
  let list = [...state.tasks];
  if (state.taskFilter === "today") list = list.filter((x) => x.due_date === t);
  else if (state.taskFilter === "upcoming") list = list.filter((x) => x.due_date > t);
  else if (state.taskFilter === "overdue") list = list.filter((x) => x.due_date && x.due_date < t && !x.done);
  else if (state.taskFilter === "starred") list = list.filter((x) => x.starred);
  else if (state.taskFilter === "done") list = list.filter((x) => x.done);

  if (state.taskFilter !== "done") list = list.filter((x) => !x.done || state.taskFilter === "all");
  list.sort((a, b) => (a.done - b.done) || ((a.due_date || "9999").localeCompare(b.due_date || "9999")) || (b.priority === "high") - (a.priority === "high"));

  const open = state.tasks.filter((x) => !x.done).length;
  const done = state.tasks.filter((x) => x.done).length;

  $("#screen-tasks").innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Work</div>
        <h2 class="page-title">Tasks</h2>
        <p class="page-sub">${open} open, ${done} done. Sorted by due date, then priority.</p>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" data-act="new" data-type="task">${icon("plus", 17)} New task</button>

    <div class="chip-pick" style="margin-bottom:18px">
      ${filters.map(([k, l]) => `<button type="button" data-act="task-filter" data-val="${k}" class="${state.taskFilter === k ? "is-on" : ""}">${l}</button>`).join("")}
    </div>

    <div class="card">
      ${list.length ? list.map(taskRowHTML).join("") : emptyHTML("checkCircle", "Nothing here", "This view is empty — which is a perfectly good place to be.", "Add a task", "task")}
    </div>`;
}

              <circle cx="84" cy="84" r="${R}" stroke="var(--ink)" stroke-width="20" fill="none"
                stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - donePct / 100)}" />
            </svg>
            <div class="mid"><div><b>${donePct}%</b><span>Complete</span></div></div>
          </div>
          <div class="legend">
            <div><i></i> Completed · ${s.totalDone}</div>
            <div><i class="hollow"></i> Still open · ${s.totalTasks - s.totalDone}</div>
            <div><i style="background:#8a8a8a"></i> Closed this week · ${s.doneThisWeek}</div>
          </div>

      </div>

      <div class="card">
        <div class="card-head"><h3>Last 7 days</h3></div>
        <div class="bars">
          ${s.days.map((d) => `
            <div class="b">

        </div>
        <p style="font-size:12.2px;color:var(--ink-3);margin-top:14px;line-height:1.6">
          ${s.doneThisWeek ? "Momentum is holding — keep the pace steady rather than sharp." : "Nothing completed in the last week. One small task is enough to restart the line."}
        </p>
      </div>

      <div class="card">
        <div class="card-head"><h3>Workload by priority</h3></div>
        ${priorities.map((x) => `
          <div style="margin-bottom:14px">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
              <span class="priority-dot ${{ high: "", medium: "mid", low: "hollow" }[x.k]}"></span>
              <span style="font-size:12.8px;font-weight:620;text-transform:capitalize">${x.k}</span>
              <span style="margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums">${x.n}</span>
            </div>
            <div class="bar ${x.k === "medium" ? "mid" : x.k === "low" ? "light" : ""}"><i style="width:${Math.round((x.n / maxPri) * 100)}%"></i></div>
          </div>`).join("")}
      </div>

      <div class="card">
        <div class="card-head"><h3>Projects in flight</h3></div>
        ${byProject.length ? byProject.map(({ p, pr }) => `
          <div style="margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
              <span class="priority-dot" style="background:${p.color}"></span>

            </div>

          </div>`).join("") : `<p style="font-size:13px;color:var(--ink-3)">No projects yet.</p>`}
      </div>
    </div>`;
}

   ========================================================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const type = el.dataset.type;
  const id = el.dataset.id;

  switch (act) {
    case "go":
      state.view = el.dataset.view;
      state.detail = null;
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
      break;

    case "open-detail":
      state.detail = { type: el.dataset.type, id };
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
      break;

    case "toggle-task":
      e.stopPropagation();
      toggleTaskDone(id);
      break;

    case "toggle-pin":
      updateItem("notes", id, { pinned: !noteById(id)?.pinned });
      render();
      break;

    case "new": {
      const preset = el.dataset.project ? { project_id: el.dataset.project } : {};
      const blank = type === "task"
        ? { ...preset, title: "", due_date: todayISO(), priority: "medium", recurrence: "none", done: false, notes: "", starred: false }
        : type === "note"
          ? { ...preset, title: "", body: "", tags: [], pinned: false, color: GREYS[0] }
          : type === "event"
            ? { ...preset, title: "", date: todayISO(), start_time: "09:00", end_time: "10:00", location: "", notes: "" }
            : { name: "", description: "", due_date: addDaysISO(todayISO(), 30), color: GREYS[0] };
      openEditor(type, blank);
      state.editing.id = null;
      break;
    }

    case "edit":
      openEditor(type, state[collectionOf(type)].find((r) => r.id === id));
      break;

    case "duplicate": {
      const collection = collectionOf(type);
      const src = state[collection].find((r) => r.id === id);
      if (src) {
        const copy = { ...src, id: uid(), created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
        if (type === "task") copy.title = src.title + " (copy)";
        if (type === "note") copy.title = src.title + " (copy)";
        if (type === "project") copy.name = src.name + " (copy)";
        if (type === "event") copy.title = src.title + " (copy)";
        createItem(collection, copy);
        render();
        toast("Duplicated.", "copy");
      }
      break;
    }

    case "delete": {
      const collection = collectionOf(type);
      confirmAction("Delete this " + type + "?", "This can't be undone once it has synced to your account.", "Yes, delete", () => {
        deleteItem(collection, id);
        if (state.detail && state.detail.id === id) { state.detail = null; state.view = "home"; }
        render();
        toast("Deleted.", "trash");
      });
      break;
    }

    case "confirm-yes":
      closeModal();
      if (state.pendingConfirm) { const fn = state.pendingConfirm; state.pendingConfirm = null; fn(); }
      break;

    case "editor-save": saveEditor(); break;
    case "editor-delete": deleteFromEditor(); break;
    case "close-modal": closeModal(); break;

    case "open-auth": openAuth(); break;
    case "auth-tab":
      state.authTab = el.dataset.tab;
      state.authError = "";
      renderAuth();
      break;
    case "auth-submit": authSubmit(); break;
    case "sign-out": signOut(); break;

    case "sync-now": syncNow({ silent: false }); break;

    case "task-filter":
      state.taskFilter = el.dataset.val;
      render();
      break;

    case "note-filter":
      state.noteFilter = el.dataset.val;
      render();
      break;

    case "cal-prev":
      state.calendarMonth--;
      if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
      render();
      break;

    case "cal-next":
      state.calendarMonth++;
      if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
      render();
      break;

    case "cal-today":
      state.calendarMonth = new Date().getMonth();
      state.calendarYear = new Date().getFullYear();
      render();
      break;

    case "cal-day": {
      e.stopPropagation();
      const date = el.dataset.date;
      const existing = state.events.find((x) => x.date === date);
      openEditor("event", existing || { title: "", date, start_time: "09:00", end_time: "10:00", location: "", notes: "" });
      state.editing.id = null;
      break;
    }

    case "toggle-theme": {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("remindly.theme", next);
      render();
      break;
    }

    case "focus-open": openFocus(); break;
    case "focus-toggle": focusToggle(); break;
    case "focus-reset":
      clearInterval(focus.tick); focus.running = false;
      focus.left = focus.total;
      renderFocus();
      break;

    case "export": {
      const payload = JSON.stringify({
        exported_at: new Date().toISOString(),
        projects: state.projects, tasks: state.tasks, notes: state.notes, events: state.events,
      }, null, 2);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
      a.download = `remindly-export-${todayISO()}.json`;
      a.click();
      toast("Export downloaded.", "download");
      break;
    }

    case "print": window.print(); break;

    case "install":
      if (window.deferredInstall) {
        window.deferredInstall.prompt();
        window.deferredInstall.userChoice.then(() => (window.deferredInstall = null));
      } else {
        toast("Your browser will offer install from the address bar menu.", "info");
      }
      break;

    case "reset-demo":
      confirmAction("Load demo data?", "This replaces everything currently on this device. Anything already synced to your account is unaffected.", "Yes, load demo", () => {
        seedDemo();
        state.detail = null;
        render();
        toast("Demo workspace loaded.", "sparkle");
      });
      break;

    case "erase":
      confirmAction("Erase local data?", "Every note, task, project and event stored in this browser will be removed. Anything already synced to your account stays there.", "Yes, erase", () => {
        state.projects = []; state.tasks = []; state.notes = []; state.events = [];
        state.outbox = []; save();
        state.detail = null;
        render();
        toast("Local data erased.", "trash");
      });
      break;

    case "fab": {
      const map = { home: "task", tasks: "task", notes: "note", calendar: "event", projects: "project", search: "task", stats: "task", settings: "task", detail: "task" };
      const t = map[state.view] || "task";
      openEditor(t, t === "task" ? { title: "", due_date: todayISO(), priority: "medium", recurrence: "none", notes: "", starred: false, done: false }
        : t === "note" ? { title: "", body: "", tags: [], pinned: false, color: GREYS[0] }
        : t === "event" ? { title: "", date: todayISO(), start_time: "09:00", end_time: "10:00", location: "", notes: "" }
        : { name: "", description: "", due_date: addDaysISO(todayISO(), 30), color: GREYS[0] });
      state.editing.id = null;
      break;
    }
  }
});

$("#global-search").addEventListener("input", debounce((e) => {
  state.search = e.target.value;
  if (state.search && state.view !== "search") { state.view = "search"; state.detail = null; }
  render();
}, 180));

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    $("#global-search").focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") {
    e.preventDefault();
    openEditor("note", { title: "", body: "", tags: [], pinned: false, color: GREYS[0] });
    state.editing.id = null;
  }
});

$("#scrim").addEventListener("click", (e) => {
  if (e.target.id === "scrim") closeModal();
});

document.addEventListener("change", (e) => {
  if (e.target.id !== "import-file") return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      ["projects", "tasks", "notes", "events"].forEach((k) => {
        const incoming = Array.isArray(d[k]) ? d[k] : [];
        incoming.forEach((row) => {
          const exists = state[k].some((r) => r.id === row.id);
          if (!exists) {
            state[k].push(stamp(row));
            queueOp("upsert", k, state[k][state[k].length - 1]);
          }
        });
      });
      save();
      render();
      toast("Import complete.", "upload");
    } catch (err) {
      toast("That file couldn't be read.", "alert");
    }
  };
  reader.readAsText(file);
});

window.addEventListener("online", () => { setSyncChip(); syncNow(); toast("Back online — syncing.", "cloud"); });
window.addEventListener("offline", () => { setSyncChip(); toast("You're offline. Changes are saved on this device.", "wifiOff"); });

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  window.deferredInstall = e;
});

/* =========================================================
   17. Boot
   ========================================================= */
(async function boot() {
  const savedTheme = localStorage.getItem("remindly.theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;

  await openIDB();

  const hadData = load();
  if (!hadData) {
    if (CONFIGURED) {
      state.projects = []; state.tasks = []; state.notes = []; state.events = [];
    } else {
      seedDemo();
    }
  }

  // anything a browser held back while offline gets force-migrated to greyscale
  const desaturate = (hex) => (GREYS.includes(hex) ? hex : GREYS[0]);
  state.projects.forEach((p) => (p.color = desaturate(p.color || GREYS[0])));
  state.notes.forEach((n) => (n.color = desaturate(n.color || GREYS[0])));
  state.events.forEach((e) => (e.color = desaturate(e.color || GREYS[0])));

  const queued = await idbGet("outbox");
  if (Array.isArray(queued) && queued.length && !state.outbox.length) state.outbox = queued;

  render();

  if (CONFIGURED) {
    setSyncChip();
    toast("Supabase connected. Sign in to sync across devices.", "cloud");
  } else {
    toast("Demo mode — add your Supabase keys to go live.", "info");
  }

  setInterval(() => {
    if (state.mode === "live" && navigator.onLine && !state.outbox.length) syncNow();
  }, 45000);
})();
</script>
