    if (!data || !data.session) return { ok: true, needsConfirm: true, email: mail };
    this.applySession(data.session);
    return { ok: true, user: this.user, needsConfirm: false };
  },

  /* ---------------- log in ---------------- */
  async logIn({ email, password, remember = true }) {
    const errs = {};
    const mail = String(email || "").trim().toLowerCase();
    if (!mail) errs.email = "Please enter your email address.";
    if (!password) errs.password = "Please enter your password.";
    if (Object.keys(errs).length) return { ok: false, errors: errs };

    const { data, error } = await sb.client.auth.signInWithPassword({ email: mail, password: String(password) });

    if (error) {
      const m = String(error.message || "");
      if (/invalid login credentials/i.test(m)) return { ok: false, errors: { password: "That email or password doesn't match this account." } };
      if (/email not confirmed/i.test(m)) return { ok: false, errors: { email: "Please confirm your email first — check your inbox." } };
      if (/rate limit|too many/i.test(m)) return { ok: false, errors: { form: "Too many attempts. Please wait a moment and try again." } };
      return { ok: false, errors: { form: friendlyAuthError(error) } };
    }

    // "Remember me" off = sign out automatically when the tab closes.
    try {
      sessionStorage.setItem(K.temporary, remember ? "0" : "1");
    } catch (e) { }

    this.applySession(data.session);
    return { ok: true, user: this.user };
  },

  /* ---------------- log out ---------------- */
  async logOut() {
    realtime.stop();
    if (sb.configured) {
      try { await sb.client.auth.signOut(); } catch (e) { }
    }
    this.user = null;
    this.session = null;
    this.mode = "guest";
    store.reminders = [];
    try { sessionStorage.removeItem(K.temporary); } catch (e) { }
  },

  /* ---------------- session restore ---------------- */
  async restore() {
    if (!sb.configured) return false;
    const { data, error } = await sb.client.auth.getSession();
    if (error || !data || !data.session) return false;
    this.applySession(data.session);
    return true;
  },

  sessionExpired() {
    return this.mode === "user" && (!this.session || !sb.configured);
  },

  /** Sliding session: Supabase refreshes tokens automatically. */
  touch() { },

  /* ---------------- auth state stream ---------------- */
  listen() {
    if (!sb.configured) return;
    sb.client.auth.onAuthStateChange((event, session) => {
      // Never await Supabase calls inside this callback (deadlock risk).
      setTimeout(() => auth.handleAuthEvent(event, session), 0);
    });
  },

  async handleAuthEvent(event, session) {
    if (event === "INITIAL_SESSION") {
      if (session) this.applySession(session);
      this.ready = true;
      return;
    }

    if (event === "SIGNED_IN" && session) {
      const isNew = !this.user;
      this.applySession(session);
      if (isNew) {
        await store.init();
        realtime.start(this.user.id);
        applyTheme(store.prefs.theme || "light");
        router.go(this.user.onboarded ? "dashboard" : "onboarding");
        ui.toast(`Signed in as ${this.user.displayName}`, "ok");
      }
      return;
    }

    if (event === "SIGNED_OUT") {
      realtime.stop();
      this.user = null;
      this.session = null;
      this.mode = "guest";
      store.reminders = [];
      appState.showNetwork("clear");
      if (router.isApp() || ["reset"].includes(router.route)) {
        ui.toast("You've been signed out.", "info");
        router.go("landing");
      }
      return;
    }

    if (event === "TOKEN_REFRESHED" && session) {
      this.applySession(session);
      return;
    }

    if (event === "USER_UPDATED" && session) {
      this.applySession(session);
      safeRender();
      return;
    }

    if (event === "PASSWORD_RECOVERY" && session) {
      this.applySession(session);
      router.go("reset");
      return;
    }
  },

  /* ---------------- password ---------------- */
  async forgotPassword(email) {
    const mail = String(email || "").trim().toLowerCase();
    const generic = { ok: true, message: "If that email is registered, a reset link is on its way." };
    if (!mail) return { ok: false, errors: { email: "Please enter your email address." } };

    const { error } = await sb.client.auth.resetPasswordForEmail(mail, {
      redirectTo: location.origin + location.pathname + "#/reset"
    });
    if (error && /rate limit|too many/i.test(error.message)) {
      return { ok: false, errors: { email: "Too many reset requests. Please wait a moment and try again." } };
    }
    // Same response either way so the form cannot be used to probe accounts.
    return generic;
  },

  /** Sets a new password for the currently signed-in (recovery) session. */
  async resetPassword(_token, password, confirm) {
    const errs = {};
    if (!password) errs.password = "Please choose a new password.";
    else if (String(password).length < 8) errs.password = "Password must be at least 8 characters.";
    if (String(confirm) !== String(password)) errs.confirm = "Those passwords don't match yet.";
    if (Object.keys(errs).length) return { ok: false, errors: errs };

    const { data: s } = await sb.client.auth.getSession();
    if (!s || !s.session) return { ok: false, errors: { token: "Open the reset link from your email to set a new password." } };

    const { error } = await sb.client.auth.updateUser({ password: String(password) });
    if (error) return { ok: false, errors: { password: "We couldn't update that password. Please try again." } };
    return { ok: true };
  },

  /** Signed-in password change. Supabase verifies the session, not the old password. */
  async changePassword(_current, next, confirm) {
    const errs = {};
    if (!next || String(next).length < 8) errs.next = "Password must be at least 8 characters.";
    if (String(confirm) !== String(next)) errs.confirm = "Those passwords don't match yet.";
    if (Object.keys(errs).length) return { ok: false, errors: errs };

    const { error } = await sb.client.auth.updateUser({ password: String(next) });
    if (error) return { ok: false, errors: { next: "We couldn't update that password. Please try again." } };
    return { ok: true };
  },

  /* ---------------- profile ---------------- */
  async updateProfile(patch) {
    if (this.mode === "guest") {
      if (patch.prefs) this.user.prefs = { ...this.user.prefs, ...patch.prefs };
      return { ok: true, user: this.user };
    }

    const data = {};
    if (patch.displayName !== undefined) {
      const name = String(patch.displayName).trim();
      if (!name) return { ok: false, errors: { displayName: "Please tell us your name." } };
      data.display_name = name;
    }
    if (patch.avatar !== undefined) data.avatar = patch.avatar;
    if (patch.prefs) data.prefs = { ...(this.user.prefs || {}), ...patch.prefs };
    if (patch.onboarded !== undefined) data.onboarded = !!patch.onboarded;
    if (patch.uses !== undefined) data.uses = patch.uses;

    if (Object.keys(data).length) {
      const { error } = await sb.client.auth.updateUser({ data });
      if (error) {
        // Avatar images can exceed metadata limits — fall back to this device.
        if (patch.avatar && patch.avatar.type === "image") {
          extra.patch(this.user.id, "__account", { avatar: patch.avatar });
          return { ok: true, user: this.user, localOnly: true };
        }
        return { ok: false, errors: { form: "We couldn't save that change. Please try again." } };
      }
    }

    let emailChange = false;
    if (patch.email !== undefined) {
      const mail = String(patch.email).trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) return { ok: false, errors: { email: "That email doesn't look right." } };
      if (mail !== this.user.email) {
        const { error } = await sb.client.auth.updateUser({ email: mail });
        if (error) {
          if (/already/i.test(error.message)) return { ok: false, errors: { email: "That email is already registered." } };
          return { ok: false, errors: { email: "We couldn't update that email. Please try again." } };
        }
        emailChange = true;
      }
    }

    await this.refreshUser();
    return { ok: true, user: this.user, emailChange };
  },

  async refreshUser() {
    if (!sb.configured) return;
    const { data } = await sb.client.auth.getUser();
    if (data && data.user) {
      const prev = this.user || {};
      this.user = this.fromSupabaseUser(data.user);
      if (prev.displayName && !this.user.user_metadata) this.user.displayName = prev.displayName;
    }
  },

  /* ---------------- guest ---------------- */
  enterGuest() {
    this.mode = "guest";
    this.user = {
      id: "guest",
      displayName: "Guest",
      email: null,
      avatar: { type: "initials", color: "#8B8F8A" },
      prefs: { ...DEFAULT_PREFS },
      onboarded: true
    };
  }
};

function friendlyAuthError(error) {
  const m = String((error && error.message) || "");
  if (/failed to fetch|networkerror|network error|load failed|fetch failed/i.test(m)) {
    return "We couldn't reach Remindly. Check your connection and try again.";
  }
  if (/jwt|token|session/i.test(m)) return "Your session needs refreshing. Please log in again.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Please wait a moment and try again.";
  return "Something didn't work there. Please try again.";
}

/* ============================================================ realtime */
const realtime = {
  channel: null,
  uid: null,
  started: false,
  refreshTimer: null,

  start(userId) {
    if (!sb.configured || !userId || userId === "guest") return;
    if (this.channel && this.uid === userId) return;   // never duplicate
    this.stop();

    const ch = sb.client
      .channel(`remindly:${userId}`)
      .on("postgres_changes",
        { event: "*", schema: "public", table: "reminders", filter: `user_id=eq.${userId}` },
        payload => this.apply(payload))
      .subscribe(status => {
        if (status === "SUBSCRIBED") {
          this.started = true;
          appState.showNetwork("clear");
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          this.started = false;
          if (navigator.onLine) appState.showNetwork("offline");
        }
      });

    this.channel = ch;
    this.uid = userId;
  },

  stop() {
    if (this.channel && sb.configured) {
      try { sb.client.removeChannel(this.channel); } catch (e) { }
    }
    this.channel = null;
    this.uid = null;
    this.started = false;
    if (this.refreshTimer) { clearInterval(this.refreshTimer); this.refreshTimer = null; }
  },

  apply(payload) {
    if (!auth.user || auth.mode !== "user") return;
    const uid = auth.user.id;

    if (payload.eventType === "DELETE") {
      const id = payload.old && payload.old.id != null ? String(payload.old.id) : null;
      if (!id) return;
      const had = store.reminders.some(r => r.id === id);
      store.reminders = store.reminders.filter(r => r.id !== id);
      if (had) {
        ui.toast("A reminder was removed on another device.", "info");
        scheduleRender();
      }
      return;
    }

    const row = payload.new;
    // RLS already restricts events to the owner — this is defence in depth.
    if (!row || (row.user_id && row.user_id !== uid)) return;

    const next = rowToReminder(row, uid);
    const idx = store.reminders.findIndex(r => r.id === next.id);

    if (idx >= 0) {
      // Keep any local pending/failed marker that has not been confirmed yet.
      store.reminders[idx] = { ...store.reminders[idx], ...next, _pending: false, _failed: false };
    } else {
      store.reminders.push(next);
    }
    scheduleRender();
  },

  /** Fallback poll if realtime is unavailable. */
  startPolling() {
    if (this.refreshTimer) return;
    this.refreshTimer = setInterval(async () => {
      if (!auth.user || auth.mode !== "user" || !navigator.onLine) return;
      await store.refresh();
    }, 45000);
  }
};

/* ============================================================ store */
function makeReminder(o = {}) {
  return {
    id: o.id || ("tmp_" + rid()),
    userId: o.userId || (auth.user ? auth.user.id : "guest"),
    title: "Untitled reminder",
    notes: "",
    date: ymd(new Date()),
    time: "09:00",
    repeat: "none",
    custom: { every: 1, unit: "days" },
    priority: "medium",
    category: "Other",
    color: null,
    notify: true,
    completed: false,
    completedAt: null,
    notifiedFor: null,
    snoozeUntil: null,
    snoozeCount: 0,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    _pending: false,
    _failed: false,
    ...o
  };
}

const store = {
  reminders: [],
  prefs: { ...DEFAULT_PREFS },
  status: "ready",     // ready | loading | error | offline
  busy: { saving: new Set(), deleting: new Set() },

  /* ---------------- load ---------------- */
  async init() {
    if (!auth.user) return;
    this.loadPrefs();

    if (auth.mode === "guest") {
      try {
        const raw = JSON.parse(localStorage.getItem(K.guest) || "[]");
        this.reminders = raw.map(r => makeReminder({ ...r, userId: "guest" }));
        this.status = "ready";
      } catch (e) {
        this.reminders = [];
        this.status = "error";
      }
      return;
    }

    this.status = "loading";
    try {
      const uid = await auth.userId();
      if (!uid) throw new Error("NO_SESSION");

      const { data, error } = await sb.client
        .from("reminders")
        .select("*")
        .eq("user_id", uid)
        .order("reminder_date", { ascending: true })
        .order("reminder_time", { ascending: true });

      if (error) throw error;

      this.reminders = (data || []).map(row => rowToReminder(row, uid));
      this.status = "ready";
    } catch (e) {
      this.reminders = [];
      this.status = /fetch|network|load failed/i.test(String(e && e.message)) ? "offline" : "error";
      ui.toast("We couldn't load your reminders. Please check your connection and try again.", "warn");
    }
  },

  /** Silent re-sync used by realtime fallback polling. */
  async refresh() {
    if (auth.mode !== "user" || !sb.configured) return;
    try {
      const uid = await auth.userId();
      const { data, error } = await sb.client
        .from("reminders").select("*").eq("user_id", uid)
        .order("reminder_date", { ascending: true }).order("reminder_time", { ascending: true });
      if (error) return;
      this.reminders = (data || []).map(row => rowToReminder(row, uid));
      scheduleRender();
    } catch (e) { }
  },

  /* ---------------- prefs (always local, per user) ---------------- */
  loadPrefs() {
    if (!auth.user) return;
    const saved = (() => {
      try { return JSON.parse(localStorage.getItem(K.prefs(auth.user.id)) || "null"); } catch (e) { return null; }
    })();
    this.prefs = { ...DEFAULT_PREFS, ...(auth.user.prefs || {}), ...(saved || {}) };
    if (auth.user.onboarded !== undefined) this.prefs.onboarded = auth.user.onboarded;
  },

  async persist() {
    if (!auth.user) return;
    try { localStorage.setItem(K.prefs(auth.user.id), JSON.stringify(this.prefs)); } catch (e) { }
    if (auth.mode === "guest") {
      try { localStorage.setItem(K.guest, JSON.stringify(this.reminders)); } catch (e) { }
    }
  },

  /* ---------------- reads ---------------- */
  get(id) { return this.reminders.find(r => r.id === id); },

  /* ---------------- create ---------------- */
  async add(r) {
    const temp = makeReminder({ ...r, id: r.id && !String(r.id).startsWith("tmp_") ? r.id : ("tmp_" + rid()), _pending: true });

    if (auth.mode === "guest") {
      temp._pending = false;
      this.reminders.push(temp);
      await this.persist();
      ui.toast("Reminder saved.");
      return temp;
    }

    // Optimistic: show it instantly.
    this.reminders.push(temp);
    safeRender();
    this.busy.saving.add(temp.id);

    try {
      const uid = await auth.userId();
      if (!uid) throw new Error("NO_SESSION");

      const row = mapToRow(temp, uid);
      let res = await sb.client.from("reminders").insert(row).select().single();

      // Some schemas use a non-default id — retry once with a generated UUID.
      if (res.error && /null value in column "id"|23502/i.test(String(res.error.message) + String(res.error.code))) {
        res = await sb.client.from("reminders").insert({ id: makeUuid(), ...row }).select().single();
      }
      if (res.error) throw res.error;

      const saved = rowToReminder(res.data, uid);
      const idx = this.reminders.findIndex(x => x.id === temp.id);
      if (idx >= 0) this.reminders[idx] = saved; else this.reminders.push(saved);
      ui.toast("Reminder saved.");
      return saved;
    } catch (e) {
      temp._failed = true;
      temp._pending = false;
      ui.toast("Couldn't save your reminder. Please try again.", "warn");
      return null;
    } finally {
      this.busy.saving.delete(temp.id);
      safeRender();
    }
  },

  /* ---------------- update ---------------- */
  async update(id, patch) {
    const r = this.get(id);
    if (!r) return;
    const before = { ...r };
    Object.assign(r, patch, { updatedAt: new Date().toISOString() });

    // Fields that have no column yet -> per-device supplement.
    const EXTRA_KEYS = ["color", "completedAt", "notifiedFor", "snoozeUntil", "snoozeCount"];
    const touchedExtra = EXTRA_KEYS.some(k => k in patch);
    const touchedRow = ["title", "notes", "date", "time", "category", "priority", "completed", "repeat", "custom", "notify"]
      .some(k => k in patch);

    if (auth.mode === "guest") {
      await this.persist();
      ui.toast(touchedRow && "completed" in patch ? (r.completed ? "Reminder completed." : "Reminder restored.") : "Reminder saved.");
      return r;
    }

    if (touchedExtra && auth.user) extra.patch(auth.user.id, id, {
      ...( "color" in patch ? { color: patch.color } : {}),
      ...( "completedAt" in patch ? { completedAt: patch.completedAt } : {}),
      ...( "notifiedFor" in patch ? { notifiedFor: patch.notifiedFor } : {}),
      ...( "snoozeUntil" in patch ? { snoozeUntil: patch.snoozeUntil } : {}),
      ...( "snoozeCount" in patch ? { snoozeCount: patch.snoozeCount } : {})
    });

    if (!touchedRow) { safeRender(); return r; }

    // Still inserting optimistically — the pending row will carry these changes.
    if (String(id).startsWith("tmp_")) return r;

    safeRender();
    this.busy.saving.add(id);
    try {
      const uid = await auth.userId();
      const { error } = await sb.client
        .from("reminders")
        .update(mapToRow(r, uid, false))
        .eq("id", id)
        .eq("user_id", uid);
      if (error) throw error;
      r._pending = false;
      r._failed = false;
      ui.toast("completed" in patch ? (r.completed ? "Reminder completed." : "Reminder restored.") : "Reminder saved.");
    } catch (e) {
      Object.assign(r, before, { _failed: true });
      ui.toast("Couldn't save your changes. Please try again.", "warn");
    } finally {
      this.busy.saving.delete(id);
      safeRender();
    }
    return r;
  },

  /* ---------------- delete ---------------- */
  async remove(id) {
    const idx = this.reminders.findIndex(r => r.id === id);
    if (idx < 0) return;
    const removed = this.reminders[idx];

    if (auth.mode === "guest") {
      this.reminders.splice(idx, 1);
      await this.persist();
      ui.toast("Reminder deleted.");
      return;
    }

    this.reminders.splice(idx, 1);   // optimistic
    safeRender();
    this.busy.deleting.add(id);

    try {
      if (String(id).startsWith("tmp_")) {
        // Never reached the database — nothing to delete remotely.
        return;
      }
      const uid = await auth.userId();
      const { error } = await sb.client
        .from("reminders")
        .delete()
        .eq("id", id)
        .eq("user_id", uid);
      if (error) throw error;
      if (auth.user) extra.drop(auth.user.id, id);
      ui.toast("Reminder deleted.");
    } catch (e) {
      this.reminders.splice(Math.min(idx, this.reminders.length), 0, removed);
      ui.toast("Couldn't delete your reminder. Please try again.", "warn");
    } finally {
      this.busy.deleting.delete(id);
      safeRender();
    }
  },

  async clearCompleted() {
    const done = this.reminders.filter(r => r.completed);
    if (!done.length) return;

    if (auth.mode === "guest") {
      this.reminders = this.reminders.filter(r => !r.completed);
      await this.persist();
      ui.toast("Completed reminders cleared.");
      return;
    }

    const realIds = done.filter(r => !String(r.id).startsWith("tmp_")).map(r => r.id);
    this.reminders = this.reminders.filter(r => !r.completed);
    safeRender();

    try {
      if (realIds.length) {
        const uid = await auth.userId();
        const { error } = await sb.client.from("reminders").delete().eq("user_id", uid).in("id", realIds);
        if (error) throw error;
      }
      ui.toast("Completed reminders cleared.");
    } catch (e) {
      await this.refresh();
      ui.toast("Couldn't clear those reminders. Please try again.", "warn");
    }
  },

  /* ---------------- misc ---------------- */
  async markNotified(id, key) {
    const r = this.get(id);
    if (!r) return;
    r.notifiedFor = key;
    if (auth.user && auth.mode === "user") extra.patch(auth.user.id, id, { notifiedFor: key });
    else await this.persist();
  },

  /** Sample content for first-run / empty accounts (never auto-applied). */
  async loadSamples() {
    const t = new Date();
    const d = n => { const x = new Date(t); x.setDate(x.getDate() + n); return ymd(x); };
    const samples = [
      { title: "Water the plants", notes: "Kitchen ferns and the balcony herbs.", date: d(0), time: "08:00", category: "Personal", priority: "low", repeat: "daily" },
      { title: "Team stand-up", notes: "Quick sync — bring the sprint board up to date.", date: d(0), time: "09:30", category: "Work", priority: "medium", repeat: "weekdays" },
      { title: "Maths revision", notes: "Chapter 6 — integration by parts. 40 minutes, no phone.", date: d(0), time: "18:00", category: "School", priority: "high", repeat: "weekly" },
      { title: "Gym session", notes: "Legs + 20 minutes of cardio.", date: d(1), time: "07:00", category: "Personal", priority: "medium", repeat: "weekdays" },
      { title: "Review website update", notes: "Check the new landing copy and the mobile breakpoints.", date: d(1), time: "17:00", category: "Work", priority: "medium", repeat: "none" },
      { title: "Pay electricity bill", notes: "Standing order failed last month — do it manually.", date: d(3), time: "09:00", category: "Important", priority: "urgent", repeat: "monthly" },
      { title: "Plan next week", notes: "Block three deep-work sessions and move admin to Friday.", date: d(5), time: "09:00", category: "Work", priority: "low", repeat: "weekly" }
    ];
    for (const s of samples) await this.add(makeReminder({ ...s, userId: auth.user.id }));
    render();
  }
};

/* ============================================================ format */
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MONTHS_S = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseYmd(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function isSameDay(a, b) { return ymd(a) === ymd(b); }

const format = {
  fullDate(d) { return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; },
  longDay(d) { return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; },
  shortDate(d) {
    const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    if (diff > 1 && diff < 7) return DAYS[d.getDay()];
    return `${d.getDate()} ${MONTHS_S[d.getMonth()]}`;
  },
  time(hhmm) {
    const [h, m] = String(hhmm).slice(0, 5).split(":").map(Number);
    if (store.prefs.timeFormat === "24") return `${pad(h)}:${pad(m)}`;
    const ap = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${pad(m)} ${ap}`;
  },
  timeFromDate(d) { return format.time(`${pad(d.getHours())}:${pad(d.getMinutes())}`); },
  relative(dt) {
    let ms = dt - Date.now();
    const past = ms < 0;
    ms = Math.abs(ms);
    const mins = Math.round(ms / 60000);
    const days = Math.floor(mins / 1440);
    const hours = Math.floor((mins % 1440) / 60);
    const m = mins % 60;
    let body;
    if (mins < 1) body = null;
    else if (mins < 60) body = `${mins}m`;
    else if (days === 0) body = hours + "h" + (m ? ` ${m}m` : "");
    else if (days < 7) body = `${days}d ${hours}h`;
    else body = `${Math.round(days / 7)}w`;
    if (!body) return "Due now";
    return past ? `Overdue by ${body}` : `Due in ${body}`;
  },
  countdown(dt) {
    let ms = dt - Date.now();
    const past = ms < 0;
    ms = Math.max(0, ms);
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const body = h > 0 ? `${pad(h)}h ${pad(m)}m` : m > 0 ? `${pad(m)}m ${pad(s)}s` : `${pad(s)}s`;
    return past ? `${body} overdue` : `${body} remaining`;
  },
  repeatLabel(r) {
    if (r.repeat === "none") return "Does not repeat";
    if (r.repeat === "daily") return "Every day";
    if (r.repeat === "weekdays") return "Weekdays";
    if (r.repeat === "weekly") return "Every week";
    if (r.repeat === "monthly") return "Every month";
    const c = r.custom || { every: 1, unit: "days" };
    const unit = c.unit === "days" ? (c.every === 1 ? "day" : "days") : c.unit === "weeks" ? (c.every === 1 ? "week" : "weeks") : (c.every === 1 ? "month" : "months");
    return `Every ${c.every} ${unit}`;
  }
};

/* ============================================================ sched */
const sched = {
  due(r) {
    const [h, m] = String(r.time).slice(0, 5).split(":").map(Number);
    const d = parseYmd(r.date);
    d.setHours(h, m, 0, 0);
    return d;
  },
  effective(r) {
    if (r.snoozeUntil) {
      const s = new Date(r.snoozeUntil);
      if (!Number.isNaN(s.getTime())) return s;
    }
    const from = startOfDay(new Date());
    const to = new Date(from); to.setFullYear(to.getFullYear() + 2);
    const occ = sched.occurrences(r, from, to);
    return occ.length ? occ[0] : sched.due(r);
  },
  occurrences(r, from, to) {
    const out = [];
    let d = sched.due(r);
    if (r.repeat === "none") { if (d >= from && d <= to) out.push(d); return out; }
    const c = r.custom || { every: 1, unit: "days" };
    let guard = 0;
    const stepDay = n => { d.setDate(d.getDate() + n); };
    const stepMonth = n => {
      const day = d.getDate();
      d.setDate(1); d.setMonth(d.getMonth() + n);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
    };
    while (d <= to && guard++ < 900) {
      if (d >= from) out.push(new Date(d));
      if (r.repeat === "daily") stepDay(1);
      else if (r.repeat === "weekdays") {
        do { stepDay(1); } while ((d.getDay() === 0 || d.getDay() === 6) && guard++ < 900);
      }
      else if (r.repeat === "weekly") stepDay(7);
      else if (r.repeat === "monthly") stepMonth(1);
      else if (r.repeat === "custom") {
        const n = Math.max(1, Number(c.every) || 1);
        if (c.unit === "days") stepDay(n);
        else if (c.unit === "weeks") stepDay(7 * n);
        else stepMonth(n);
      } else break;
    }
    return out;
  },
  onDate(r, dateObj) {
    const from = startOfDay(dateObj);
    const to = new Date(from); to.setHours(23, 59, 59, 999);
    return sched.occurrences(r, from, to).length > 0;
  },
  occurrenceOn(r, dateObj) {
    const from = startOfDay(dateObj);
    const to = new Date(from); to.setHours(23, 59, 59, 999);
    return sched.occurrences(r, from, to)[0] || null;
  },
  isOverdue(r) { return !r.completed && sched.effective(r) < new Date(); },
  isDueToday(r) { return isSameDay(sched.effective(r), new Date()); },
  advance(r) {
    const from = new Date(sched.due(r).getTime() + 60000);
    const to = new Date(from); to.setFullYear(to.getFullYear() + 2);
    const next = sched.occurrences(r, from, to)[0];
    if (!next) return null;
    return {
      date: ymd(next),
      time: `${pad(next.getHours())}:${pad(next.getMinutes())}`,
      notifiedFor: null, snoozeUntil: null, snoozeCount: 0
    };
  }
};

/* ============================================================ notif */
const notif = {
  audioCtx: null,
  supported: typeof Notification !== "undefined",
  active: new Map(),
  permission() { return this.supported ? Notification.permission : "unsupported"; },
  async request() {
    if (!this.supported) return "unsupported";
    if (!store.prefs.permissionAsked) {
      store.prefs.permissionAsked = true;
      await store.persist();
    }
    try { return await Notification.requestPermission(); } catch (e) { return "denied"; }
  },
  browser(title, body) {
    if (!this.supported || Notification.permission !== "granted") return;
    try {
      const n = new Notification(title, { body, tag: "remindly-" + Date.now(), silent: !store.prefs.sound });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { }
  },
  chime() {
    if (!store.prefs.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.audioCtx) this.audioCtx = new AC();
      const ctx = this.audioCtx;
      if (ctx.state === "suspended") ctx.resume();
      const t0 = ctx.currentTime;
      const vol = clamp(Number(store.prefs.volume) || 0, 0, 1) * 0.22;
      [[880, 0], [1174.7, 0.14]].forEach(([f, off]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine"; osc.frequency.value = f;
        gain.gain.setValueAtTime(0.0001, t0 + off);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + off + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.36);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + off); osc.stop(t0 + off + 0.4);
      });
    } catch (e) { }
  },
  inApp(r) {
    const stack = $("#notifStack");
    if (!stack) return;
    const id = "nc_" + r.id;
    if (this.active.has(id)) return;
    this.active.set(id, true);
    const when = sched.effective(r);
    const el = document.createElement("div");
    el.className = "notif-card" + (sched.isOverdue(r) ? " warn" : "");
    el.id = id;
    el.setAttribute("role", "alert");
    el.innerHTML = `
      <button class="nc-close" data-nc="dismiss" aria-label="Dismiss notification">${ICON.close}</button>
      <div class="nc-head">
        <div style="flex:1">
          <b>${esc(r.title)}</b>
          <div class="nc-sub">${esc(format.shortDate(when))} · ${esc(format.timeFromDate(when))} · ${esc(r.category)} · ${esc(format.repeatLabel(r))}</div>
        </div>
        <div class="nc-time">${esc(format.timeFromDate(when))}</div>
      </div>
      <div class="nc-actions">
        <button class="nc-btn primary" data-nc="done">Complete</button>
        <button class="nc-btn" data-nc="s5">Snooze 5 min</button>
        <button class="nc-btn" data-nc="s15">Snooze 15 min</button>
        <button class="nc-btn" data-nc="s60">Snooze 1 hour</button>
      </div>`;
    stack.appendChild(el);
    el.addEventListener("click", async e => {
      const act = e.target.closest("[data-nc]")?.dataset.nc;
      if (!act) return;
      if (act === "done") { await toggleReminder(r.id); this.dismiss(id); }
      else if (act === "dismiss") this.dismiss(id);
      else if (act.startsWith("s")) {
        const mins = Number(act.slice(1));
        await store.update(r.id, {
          snoozeUntil: new Date(Date.now() + mins * 60000).toISOString(),
          notifiedFor: null,
          snoozeCount: (r.snoozeCount || 0) + 1
        });
        ui.toast(`Snoozed for ${mins === 60 ? "1 hour" : mins + " minutes"}`, "info");
        this.dismiss(id);
        render();
      }
    });
  },
  dismiss(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    this.active.delete(id);
  },
  fire(r) {
    const when = sched.effective(r);
    this.browser(`Remindly · ${r.title}`, `${format.timeFromDate(when)} · ${r.category}`);
    this.inApp(r);
    ui.toast(`${r.title} — ${format.timeFromDate(when)}`, "info");
    this.chime();
  },
  tick() {
    if (!store.prefs.notifications || !auth.user) return;
    store.reminders.forEach(r => {
      if (r.completed || !r.notify || r._pending) return;
      const when = sched.effective(r).getTime();
      const key = String(when);
      if (when <= Date.now() && r.notifiedFor !== key) {
        store.markNotified(r.id, key);
        notif.fire(r);
      }
    });
  },
  start() {
    this.tick();
    setInterval(() => this.tick(), 10000);
    ["visibilitychange", "focus", "online", "pageshow"].forEach(ev => {
      window.addEventListener(ev, () => { this.tick(); appState.check(); }, { passive: true });
    });
  }
};

/* ============================================================ ai */
const ai = {
  parse(text) {
    const raw = String(text || "").trim();
    let t = " " + raw.toLowerCase().replace(/[.!?,;]$/, "") + " ";
    const now = new Date();
    let date = new Date(now);
    let timeGiven = false;
    let repeat = "none";
    let custom = { every: 1, unit: "days" };
    let priority = null;

    const everyN = t.match(/every\s+(\d+)\s*(day|days|week|weeks|month|months)/);
    const everyWeekdayName = t.match(/every\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/);
    if (everyN) {
      repeat = "custom";
      custom = { every: Number(everyN[1]), unit: everyN[2].startsWith("day") ? "days" : everyN[2].startsWith("week") ? "weeks" : "months" };
    } else if (/\bevery\s+weekday|\bweekdays\b|\bmonday to friday\b/.test(t)) repeat = "weekdays";
    else if (/\bevery\s*day\b|\bdaily\b/.test(t)) repeat = "daily";
    else if (/\bevery\s*week\b|\bweekly\b/.test(t)) repeat = "weekly";
    else if (/\bevery\s*month\b|\bmonthly\b/.test(t)) repeat = "monthly";
    else if (everyWeekdayName) {
      repeat = "weekly";
      const idx = weekdayIndex(everyWeekdayName[1]);
      const delta = (idx - now.getDay() + 7) % 7 || 7;
      date = new Date(now); date.setDate(date.getDate() + delta);
    }

    const inN = t.match(/\bin\s+(\d+)\s*(day|days|week|weeks|month|months)\b/);
    const onMonthDay = t.match(/\b(?:on\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\s+(\d{1,2})(?:st|nd|rd|th)?\b/);
    const dayMonth = t.match(/\b(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(?:of\s+)?(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\b/);
    const weekday = t.match(/\b(?:on|this|next)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);

    if (/\btomorrow\b/.test(t)) { date = new Date(now); date.setDate(date.getDate() + 1); }
    else if (/\btoday\b|\btonight\b|\bthis evening\b/.test(t)) {
      date = new Date(now);
      if (/\btonight\b|\bthis evening\b/.test(t) && !/\bat\s+\d/.test(t)) { timeGiven = true; date.setHours(20, 0, 0, 0); }
    } else if (/\bnext week\b/.test(t)) { date = new Date(now); date.setDate(date.getDate() + 7); }
    else if (inN) {
      const n = Number(inN[1]);
      date = new Date(now);
      if (inN[2].startsWith("day")) date.setDate(date.getDate() + n);
      else if (inN[2].startsWith("week")) date.setDate(date.getDate() + 7 * n);
      else date.setMonth(date.getMonth() + n);
    } else if (onMonthDay || dayMonth) {
      const m = onMonthDay || dayMonth;
      const monIdx = MONTHS_S.findIndex(x => x.toLowerCase() === (onMonthDay ? m[1] : m[2]).slice(0, 3));
      const dayNum = Number(onMonthDay ? m[2] : m[1]);
      date = new Date(now.getFullYear(), monIdx, dayNum);
      if (date < startOfDay(now)) date.setFullYear(date.getFullYear() + 1);
    } else if (weekday && !everyWeekdayName) {
      const idx = weekdayIndex(weekday[1]);
      let delta = (idx - now.getDay() + 7) % 7;
      if (delta === 0) delta = 7;
      date = new Date(now); date.setDate(date.getDate() + delta);
    }

    const at = t.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/);
    const at24 = t.match(/\bat\s+(\d{1,2}):(\d{2})\b/);
    const atBare = t.match(/\bat\s+(\d{1,2})\b(?!\s*(?:am|pm|:))/);
    if (at) {
      let h = Number(at[1]) % 12;
      if (at[3] === "pm") h += 12;
      date.setHours(h, Number(at[2] || 0), 0, 0); timeGiven = true;
    } else if (at24) { date.setHours(Number(at24[1]), Number(at24[2]), 0, 0); timeGiven = true; }
    else if (/\bnoon\b/.test(t)) { date.setHours(12, 0, 0, 0); timeGiven = true; }
    else if (/\bmidnight\b/.test(t)) { date.setHours(0, 0, 0, 0); timeGiven = true; }
    else if (/\bmorning\b/.test(t)) { date.setHours(9, 0, 0, 0); timeGiven = true; }
    else if (/\bafternoon\b/.test(t)) { date.setHours(14, 0, 0, 0); timeGiven = true; }
    else if (/\bevening\b/.test(t)) { date.setHours(19, 0, 0, 0); timeGiven = true; }
    else if (atBare) { date.setHours(Number(atBare[1]), 0, 0, 0); timeGiven = true; }

    if (/\burgent\b|\basap\b|\bcritical\b|\bvery important\b/.test(t)) priority = "urgent";
    else if (/\bhigh priority\b|\bimportant\b/.test(t)) priority = "high";
    else if (/\blow priority\b|\bwhenever\b|\bnot urgent\b/.test(t)) priority = "low";

    let category = null;
    const catRules = [
      ["School", /\b(study|studies|revision|revise|homework|exam|test|assignment|class|lecture|school|university|college|maths|math|science|english|history|essay|course|seminar|lab|thesis|dissertation)\b/],
      ["Work", /\b(work|meeting|standup|stand-up|call|client|email|report|deadline|sprint|presentation|deck|interview|website|deploy|release|invoice|office|boss|colleague|review|sync|proposal|pitch)\b/],
      ["Important", /\b(bill|payment|pay|tax|insurance|passport|doctor|dentist|appointment|renew|legal|bank|visa|prescription|medicine|subscription|birthday)\b/],
      ["Personal", /\b(gym|workout|run|shopping|grocery|groceries|buy|pick up|pickup|clean|laundry|cook|dinner|family|friend|birthday|travel|flight|book|read|meditate|walk|water|plants|car|repair)\b/]
    ];
    for (const [cat, re] of catRules) if (re.test(t)) { category = cat; break; }

    let title = stripPhrases(raw)
      .replace(/^(remind me to|remind me|remember to|i need to|please|hey|hi|hello|ok|okay)\s+/i, "")
      .replace(/\s{2,}/g, " ").replace(/[\s,.;:]+$/, "").trim();
    if (!title) title = raw.trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);
    if (!category) category = guessCategory(title);
    if (!timeGiven) {
      const def = new Date(now); def.setMinutes(def.getMinutes() + Number(store.prefs.duration || 30));
      date.setHours(def.getHours(), Math.round(def.getMinutes() / 5) * 5, 0, 0);
    }
    return {
      ok: title.length > 0, title,
      date: ymd(date), time: `${pad(date.getHours())}:${pad(date.getMinutes())}`,
      repeat, custom,
      priority: priority || (category === "Important" ? "urgent" : "medium"),
      category, notify: true
    };
  }
};

function weekdayIndex(name) {
  const map = { sun: 0, sunday: 0, mon: 1, monday: 1, tue: 2, tues: 2, tuesday: 2, wed: 3, wednesday: 3, thu: 4, thur: 4, thurs: 4, thursday: 4, fri: 5, friday: 5, sat: 6, saturday: 6 };
  return map[String(name).toLowerCase()] ?? 0;
}
function guessCategory(title) {
  const t = String(title).toLowerCase();
  if (/(study|exam|homework|assignment|class|lecture|revision|maths|science|essay)/.test(t)) return "School";
  if (/(work|meeting|client|report|email|website|deploy|invoice|presentation)/.test(t)) return "Work";
  if (/(bill|pay|tax|insurance|doctor|dentist|renew|subscription|birthday)/.test(t)) return "Important";
  if (/(gym|buy|grocery|clean|call|family|friend|cook|walk|read|travel)/.test(t)) return "Personal";
  return "Other";
}
function stripPhrases(raw) {
  const patterns = [
    /\btomorrow\b/gi, /\btoday\b/gi, /\btonight\b/gi, /\bthis evening\b/gi, /\bnext week\b/gi,
    /\bevery\s+\d+\s*(?:day|days|week|weeks|month|months)\b/gi,
    /\bevery\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)\b/gi,
    /\bevery\s+weekday\b/gi, /\bmonday to friday\b/gi, /\bweekdays\b/gi,
    /\bevery\s*(?:day|week|month)\b/gi, /\bdaily\b/gi, /\bweekly\b/gi, /\bmonthly\b/gi,
    /\bin\s+\d+\s*(?:day|days|week|weeks|month|months)\b/gi,
    /\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi,
    /\bat\s+\d{1,2}:\d{2}\b/gi, /\bat\s+\d{1,2}\b/gi,
    /\bnoon\b/gi, /\bmidnight\b/gi, /\bmorning\b/gi, /\bafternoon\b/gi, /\bevening\b/gi,
    /\burgent\b/gi, /\basap\b/gi, /\bcritical\b/gi, /\bhigh priority\b/gi, /\blow priority\b/gi,
    /\bvery important\b/gi, /\bimportant\b/gi, /\bwhenever\b/gi, /\bnot urgent\b/gi,
    /\b(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\s+\d{1,2}(?:st|nd|rd|th)?\b/gi,
    /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:of\s+)?(?:january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\b/gi,
    /\b(?:on|this|next)\s+(?:sunday|monday|tuesday|wednesday|friday|saturday|thursday)\b/gi,
    /\bremind me to\b/gi, /\bremind me\b/gi, /\bremember to\b/gi
  ];
  let s = raw;
  patterns.forEach(p => { s = s.replace(p, " "); });
  return s.replace(/\s{2,}/g, " ").replace(/^[,\s]+/, "").trim();
}

/* ============================================================ ui helpers */
const ui = {
  toast(message, type = "ok") {
    const wrap = $("#toasts");
    if (!wrap) return;
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    const icon = type === "warn" ? ICON.alert : type === "info" ? ICON.clock : ICON.check;
    el.innerHTML = `${icon}<span>${esc(message)}</span>`;
    wrap.appendChild(el);
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 240); }, 3200);
  },

  confirm({ title, body, confirmLabel = "Confirm", danger = false }) {
    return new Promise(resolve => {
      const root = $("#modalRoot");
      const prev = document.activeElement;
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = `
        <div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfT">
          <div class="modal-body">
            <h2 id="cfT" style="font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0">${esc(title)}</h2>
            ${body ? `<p class="t-body muted">${esc(body)}</p>` : ""}
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" data-act="cancel">Cancel</button>
            <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-act="ok">${esc(confirmLabel)}</button>
          </div>
        </div>`;
      root.appendChild(overlay);
      const close = val => {
        overlay.remove();
        document.removeEventListener("keydown", onKey);
        if (prev && prev.focus) prev.focus();
        resolve(val);
      };
      overlay.addEventListener("click", e => {
        if (e.target === overlay) return close(false);
        const b = e.target.closest("[data-act]");
        if (b) close(b.dataset.act === "ok");
      });
      const onKey = e => {
        if (e.key === "Escape") close(false);
        if (e.key === "Enter") close(true);
      };
      document.addEventListener("keydown", onKey);
      setTimeout(() => $("[data-act='ok']", overlay)?.focus(), 30);
    });
  },

  openModal(html, { onMount, wide = false } = {}) {
    const root = $("#modalRoot");
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
    root.appendChild(overlay);
    const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") { e.preventDefault(); close(); } };
    document.addEventListener("keydown", onKey);
    overlay.addEventListener("click", e => {
      if (e.target === overlay) close();
      if (e.target.closest("[data-close]")) close();
    });
    if (onMount) onMount(overlay.querySelector(".modal"), close);
    return close;
  }
};

const appState = {
  showNetwork(kind) {
    let bar = $("#netbar");
    if (kind === "clear") { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "netbar";
      bar.className = "netbar";
      document.body.appendChild(bar);
    }
    if (kind === "offline") {
      bar.className = "netbar offline";
      bar.innerHTML = `${ICON.wifiOff} You're offline — you can keep working and changes will sync when you reconnect.`;
    } else if (kind === "syncing") {
      bar.className = "netbar syncing";
      bar.innerHTML = `${ICON.cloud} Syncing your reminders…`;
    } else if (kind === "synced") {
      bar.className = "netbar synced";
      bar.innerHTML = `${ICON.check} Everything is up to date`;
      setTimeout(() => this.showNetwork("clear"), 2200);
    }
  },
  check() {
    if (!navigator.onLine) this.showNetwork("offline");
    else if ($("#netbar") && $("#netbar").className.includes("offline")) {
      this.showNetwork("clear");
      ui.toast("Back online", "ok");
    }
    if (auth.sessionExpired()) this.sessionExpired();
  },
  sessionExpired() {
    auth.expiredNotice = true;
    auth.logOut();
    ui.toast("Your session has expired. Please sign in again.", "warn");
    router.go("login", { replace: true });
  }
};

function chipCat(cat) {
  return `<span class="chip cat-${String(cat).toLowerCase()}"><span class="dot" style="background:${CAT_COLOR[cat] || CAT_COLOR.Other}"></span>${esc(cat)}</span>`;
}
function chipPrio(p) {
  return `<span class="chip prio-${p}">${p.charAt(0).toUpperCase() + p.slice(1)}</span>`;
}
function chipRepeat(r) {
  return r.repeat === "none" ? "" : `<span class="chip">${esc(format.repeatLabel(r))}</span>`;
}
function avatarHTML(user, cls = "") {
  const a = (user && user.avatar) || { type: "initials", color: "#111312" };
  const initials = String((user && user.displayName) || "R").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "R";
  if (a.type === "image" && a.src) return `<span class="avatar ${cls}"><img src="${esc(a.src)}" alt=""></span>`;
  return `<span class="avatar ${cls}" style="background:${a.color || "#111312"}">${esc(initials)}</span>`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

function metaLine(r) {
  const eff = sched.effective(r);
  const overdue = sched.isOverdue(r);
  const soon = !r.completed && eff > Date.now() && (eff - Date.now()) < 3600000 * 3;
  return `
    <div class="rc-meta">
      <span>${ICON.clock}${esc(format.time(r.time))}</span>
      <span>${ICON.calendar}${esc(format.shortDate(eff))}</span>
      <span class="${overdue ? "due-hot" : soon ? "due-warm" : ""}">${overdue ? ICON.alert : ICON.bell}${esc(format.relative(eff))}</span>
      ${r.snoozeUntil ? `<span>${ICON.snooze}Snoozed</span>` : ""}
      ${r._pending ? `<span>${ICON.sync}Saving…</span>` : ""}
      ${r._failed ? `<span style="color:var(--coral)">${ICON.alert}Not saved</span>` : ""}
    </div>`;
}

function reminderCard(r) {
  const overdue = sched.isOverdue(r);
  return `
    <article class="rcard ${r.completed ? "is-done" : ""} ${overdue ? "overdue" : ""} ${r._pending ? "pending" : ""} ${r._failed ? "failed" : ""}" data-id="${esc(r.id)}">

function renderDashboard() {
  const now = new Date();
  const all = store.reminders.slice();
  const active = all.filter(r => !r.completed);
  const overdue = active.filter(sched.isOverdue);
  const dueToday = all.filter(sched.isDueToday);
  const todayOpen = dueToday.filter(r => !r.completed);
  const doneToday = all.filter(r => r.completed && r.completedAt && isSameDay(new Date(r.completedAt), now));
  const upcoming = active.filter(r => sched.effective(r) >= now).sort((a, b) => sched.effective(a) - sched.effective(b));
  const next = upcoming[0] || null;
  const progress = all.length ? Math.round((all.filter(r => r.completed).length / all.length) * 100) : 0;
  const firstName = String(auth.user.displayName || "there").trim().split(/\s+/)[0];

  const summary = dueToday.length === 0
    ? "Nothing is scheduled for today. Keep the day clear."

        <div class="card card-glass card-hover next-card">

          <div class="next-time">${esc(format.timeFromDate(sched.effective(next)))}</div>

      ? `<div class="mini">${doneToday.slice(0, 4).map(r => miniRow(r, r.completedAt ? new Date(r.completedAt) : sched.effective(r))).join("")}</div>
             <button class="btn btn-ghost btn-sm btn-block inline" style="margin-top:var(--s4)" data-act="open-completed">Open archive</button>`
      : `<p class="t-caption">Nothing finished yet today.</p>`}

          <div class="card" style="padding:var(--s6)">

              <div><span class="t-label">Category pulse</span><h2 class="t-heading" style="font-size:22px">Where time goes</h2></div>
            </div>
            ${catCounts.map(c => `
              <div class="pulse-row">
                <div class="pulse-top"><span class="dot" style="background:${CAT_COLOR[c.cat]}"></span><b>${c.cat}</b><span class="cnt num">${c.n}</span></div>
                <div class="pulse-bar"><i data-w="${Math.round((c.n / catMax) * 100)}" style="background:${CAT_COLOR[c.cat]}"></i></div>
              </div>`).join("")}
          </div>
        </div>
      </section>

      <section class="card rail" style="margin-top:var(--s6)">
        <div class="section-head" style="margin-bottom:0">
          <div><span class="t-label">Daylight rail</span><h2 class="t-heading">Your day, hour by hour</h2></div>
          <span class="chip"><span class="dot" style="background:var(--amber)"></span>${todaysList.length} on today</span>
        </div>
        ${buildRail(todaysList, now)}
      </section>
    </div>`;
}

function buildRail(todaysList, now) {
  let startH = 6, endH = 22;
  if (todaysList.length) {
    startH = Math.min(startH, todaysList[0].at.getHours());
    endH = Math.max(endH, todaysList[todaysList.length - 1].at.getHours() + 1);
  }
  startH = clamp(startH, 0, 23);
  endH = clamp(endH, startH + 1, 24);

  const rows = [];
  for (let h = startH; h < endH; h++) {
    const inHour = todaysList.filter(x => x.at.getHours() === h);
    const isNowHour = now.getHours() === h;
    rows.push(`
      <div class="rail-row ${inHour.length ? "has" : ""}">
        ${isNowHour ? `<div class="rail-now" style="top:${(now.getMinutes() / 60) * 100}%"><span>Now</span></div>` : ""}
        <div class="rail-hour mono muted">${esc(format.time(`${pad(h)}:00`))}</div>
        <div class="rail-tick"><i></i></div>
        <div class="rail-slot">
          ${inHour.length
        ? inHour.map(({ r }) => `
              <button class="rail-node ${r.completed ? "is-done" : ""}" data-act="edit" data-id="${esc(r.id)}">
                <span class="ndot" style="background:${r.completed ? "var(--green)" : (CAT_COLOR[r.category] || CAT_COLOR.Other)}"></span>
                <span class="ntitle">${esc(r.title)}</span>
                <span class="ntime t-caption">${esc(format.time(r.time))}</span>
              </button>`).join("")
        : `<div class="rail-blank"></div>`}
        </div>
      </div>`);
  }
  return `<div class="rail-body"><div class="rail-line"></div>${rows.join("")}</div>`;
}

function animateNumber(el, to) {
  if (!el) return;
  if (reduceMotion()) { el.textContent = String(to); return; }
  const from = Number(el.textContent) || 0;
  const t0 = performance.now();
  const step = t => {
    const p = clamp((t - t0) / 520, 0, 1);
    el.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------------------------------------------------------- reminders */
const FILTERS = [
  ["all", "All"], ["today", "Today"], ["upcoming", "Upcoming"], ["overdue", "Overdue"],
  ["completed", "Completed"], ["prio:high", "High priority"],
  ["School", "School"], ["Work", "Work"], ["Personal", "Personal"]
];

function computeReminders() {
  const { query, filter, sort } = store.ui || {};
  let list = store.reminders.filter(r => r.userId === auth.user.id);

  if (query.trim()) {
    const q = query.trim().toLowerCase();
    list = list.filter(r =>
      r.title.toLowerCase().includes(q) ||
      (r.notes || "").toLowerCase().includes(q) ||
      r.category.toLowerCase().includes(q));
  }

  const now = new Date();
  if (filter === "today") list = list.filter(sched.isDueToday);
  else if (filter === "upcoming") list = list.filter(r => !r.completed && sched.effective(r) >= now);
  else if (filter === "overdue") list = list.filter(sched.isOverdue);
  else if (filter === "completed") list = list.filter(r => r.completed);
  else if (filter === "prio:high") list = list.filter(r => r.priority === "high" || r.priority === "urgent");
  else if (CATS.includes(filter)) list = list.filter(r => r.category === filter);

  if (sort === "date") list.sort((a, b) => parseYmd(a.date) - parseYmd(b.date) || a.time.localeCompare(b.time));
  else if (sort === "priority") list.sort((a, b) => PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority] || sched.effective(a) - sched.effective(b));
  else if (sort === "created") list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else list.sort((a, b) => sched.effective(a) - sched.effective(b));

  return list;
}

function renderReminders() {
  if (!store.ui) store.ui = { filter: "all", query: "", sort: "time", calMonth: null, calDay: null };
  return `
    <div class="view-in">
      <div class="section-head">
        <div><span class="t-label">Reminder stack</span><h1 class="t-heading">Everything on your list</h1></div>
        <button class="btn btn-primary inline" data-act="add">${ICON.plus} Add Reminder</button>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          ${ICON.search}
          <input class="input" id="searchInput" type="search" placeholder="Search title, notes or category  ( / )" value="${esc(store.ui.query)}" aria-label="Search reminders">
        </div>
        <select class="input" id="sortSelect" aria-label="Sort reminders" style="width:210px;flex:0 0 auto">
          <option value="time" ${store.ui.sort === "time" ? "selected" : ""}>Sort: Time</option>
          <option value="date" ${store.ui.sort === "date" ? "selected" : ""}>Sort: Date</option>
          <option value="priority" ${store.ui.sort === "priority" ? "selected" : ""}>Sort: Priority</option>
          <option value="created" ${store.ui.sort === "created" ? "selected" : ""}>Sort: Recently created</option>
        </select>

      <div class="toolbar" style="margin-bottom:var(--s5)">
        <div class="filters" id="filterBar" role="tablist" aria-label="Filter reminders">
          ${FILTERS.map(([k, label]) => `
            <button class="filter-chip ${store.ui.filter === k ? "active" : ""}" data-filter="${k}" role="tab" aria-selected="${store.ui.filter === k}">${label}</button>`).join("")}
        </div>

      <p class="result-count" id="resultCount"></p>

    </div>`;
}

function updateRemindersList() {
  const host = $("#listHost");
  const count = $("#resultCount");
  if (!host) return;

  if (store.status === "loading") { host.innerHTML = loadingState(); if (count) count.textContent = ""; return; }

  const list = computeReminders();
  if (count) {
    count.textContent = `${list.length} reminder${list.length === 1 ? "" : "s"}` +
      (store.ui.query.trim() ? ` matching “${store.ui.query.trim()}”` : "");
  }
  host.innerHTML = list.length
    ? `<div class="list">${list.map(reminderCard).join("")}</div>`
    : (store.reminders.length
      ? emptyState({
        icon: ICON.inbox,
        title: store.ui.query.trim() ? "No matching reminders" : "No reminders in this view",
        body: store.ui.query.trim() ? "Try a different search term, or clear the filters to see everything." : "Create one and it will appear in your stack straight away.",
        action: "add", actionLabel: "Add reminder"
      })
      : newAccountEmpty());
}

/* ---------------------------------------------------------- calendar */
function renderCalendar() {
  const today = new Date();
  if (!store.ui) store.ui = { filter: "all", query: "", sort: "time", calMonth: null, calDay: null };
  const base = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date(today.getFullYear(), today.getMonth(), 1);
  const year = base.getFullYear(), month = base.getMonth();
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
  const gridStart = new Date(year, month, 1 - startOffset);
  const selKey = store.ui.calDay || ymd(today);
  const mine = store.reminders.filter(r => r.userId === auth.user.id);

  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    const rems = mine.filter(r => sched.onDate(r, d));
    cells.push({
      d, key: ymd(d), out: d.getMonth() !== month, rems,
      hasOverdue: rems.some(r => sched.isOverdue(r) && isSameDay(sched.effective(r), d))
    });
  }

  const selectedDate = parseYmd(selKey);
  const dayList = mine
    .filter(r => sched.onDate(r, selectedDate))
    .map(r => ({ r, at: sched.occurrenceOn(r, selectedDate) }))
    .filter(x => x.at)
    .sort((a, b) => a.at - b.at);
  const dayOverdue = dayList.filter(({ r }) => !r.completed && sched.effective(r) < new Date());

  return `
    <div class="view-in">
      <div class="section-head">
        <div><span class="t-label">Calendar</span><h1 class="t-heading">Month view</h1></div>
        <button class="btn btn-primary inline" data-act="add-on-date">${ICON.plus} Add on ${esc(format.shortDate(selectedDate))}</button>
      </div>

      <div class="cal-grid-wrap">
        <div class="card" style="padding:var(--s6)">
          <div class="cal-head">
            <button class="icon-btn" data-act="cal-prev" aria-label="Previous month">${ICON.chevL}</button>
            <h2 class="cal-title">${MONTHS[month]} ${year}</h2>
            <button class="icon-btn" data-act="cal-next" aria-label="Next month">${ICON.chevR}</button>
            <div style="flex:1"></div>
            <button class="btn btn-ghost btn-sm inline" data-act="cal-today">Today</button>
          </div>

          <div class="cal-dow">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<span>${d}</span>`).join("")}</div>
          <div class="cal-days">
            ${cells.map(c => {
    const isToday = c.key === ymd(today);
    const isSel = c.key === selKey;
    const dots = c.rems.slice(0, 4).map(r => `<span class="cal-dot ${r.repeat && r.repeat !== "none" ? "rep" : ""}" style="background:${r.completed ? "var(--green)" : (CAT_COLOR[r.category] || CAT_COLOR.Other)}"></span>`).join("");
    return `
                <button class="cal-day ${c.out ? "out" : ""} ${isToday ? "today" : ""} ${isSel ? "sel" : ""} ${c.hasOverdue ? "has-overdue" : ""}"
                        data-act="cal-day" data-day="${c.key}"
                        aria-label="${esc(format.fullDate(c.d))}, ${c.rems.length} reminders${c.hasOverdue ? ", has overdue" : ""}">
                  <span class="dnum">${c.d.getDate()}</span>
                  <span class="cal-dots">${dots}${c.rems.length > 4 ? `<span class="cal-more">+${c.rems.length - 4}</span>` : ""}</span>
                </button>`;
  }).join("")}
          </div>

          <div class="note" style="margin-top:var(--s5)">
            ${ICON.info}
            <div><b style="color:var(--ink)">Reading the grid:</b> square dots are recurring reminders, round dots are one-off. A red marker means something on that day is overdue.</div>
          </div>
        </div>

        <div class="day-panel">
          <div class="card" style="padding:var(--s6)">
            <span class="t-label muted">Selected day</span>
            <h2 class="t-heading" style="margin:8px 0 4px">${esc(format.fullDate(selectedDate))}</h2>
            <p class="t-caption" style="margin-bottom:var(--s5)">${dayList.length} reminder${dayList.length === 1 ? "" : "s"} scheduled${dayOverdue.length ? ` · ${dayOverdue.length} overdue` : ""}</p>

            ${dayOverdue.length ? `
              <div class="alert" style="margin-bottom:var(--s4)">
                ${ICON.alert}
                <div><b>${dayOverdue.length} overdue</b><div class="t-caption">Needs a decision on this day.</div></div>
              </div>` : ""}

            ${dayList.length
      ? `<div class="list">${dayList.map(({ r }) => reminderCard(r)).join("")}</div>`
      : emptyState({
        icon: ICON.calendar,
        title: "No reminders for this day",
        body: "Create one directly from this date — it will be pre-filled for you.",
        action: "add-on-date", actionLabel: "Add reminder"
      })}
          </div>
        </div>
      </div>
    </div>`;
}

/* ============================================================ router */
const router = {
  route: "landing",
  params: {},
  view: $("#view"),
  publicView: $("#publicView"),
  appShell: $("#appShell"),

  go(route, opts = {}) {
    this.route = route;
    this.params = opts.params || {};
    if (!opts.replace) {
      const hash = route === "landing" ? "#/" : "#" + route + (this.params.token ? "/" + this.params.token : "");
      if (location.hash !== hash) history.pushState(null, "", hash);
    }
    render();
    window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
  },

  read() {
    const raw = location.hash.replace(/^#\/?/, "");
    const [route, param] = raw.split("/");
    const map = {
      "": "landing", "login": "login", "signup": "signup", "forgot": "forgot",
      "reset": "reset", "dashboard": "dashboard", "reminders": "reminders",
      "calendar": "calendar", "completed": "completed", "settings": "settings",
      "profile": "profile", "onboarding": "onboarding"
    };
    const r = map[route] || "landing";
    this.route = r;
    this.params = param ? { token: param } : {};

    const protectedRoutes = ["dashboard", "reminders", "calendar", "completed", "settings", "profile", "onboarding"];
    if (protectedRoutes.includes(r) && !auth.user) {
      this.route = "login";
      this.params = { from: r };
      ui.toast("Please log in to continue.", "info");
    }
  },

  isApp() {
    return ["dashboard", "reminders", "calendar", "completed", "settings", "profile"].includes(this.route) && !!auth.user;
  }
};

const VIEW_TITLES = {
  dashboard: "Dashboard", reminders: "Reminders", calendar: "Calendar",
  completed: "Completed", settings: "Settings", profile: "Profile"
};

function safeRender() {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  render();
}

let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  setTimeout(() => { renderScheduled = false; safeRender(); }, 220);
}

function render() {
  const r = router.route;

  // ---- public routes
  if (!router.isApp()) {
    router.appShell.hidden = true;
    router.publicView.hidden = false;
    const sp = $("#splash");
    if (sp) sp.classList.add("out");

    if (r === "landing") router.publicView.innerHTML = renderLanding();
    else if (r === "login") router.publicView.innerHTML = renderLogin();
    else if (r === "signup") router.publicView.innerHTML = renderSignup();
    else if (r === "forgot") router.publicView.innerHTML = renderForgot();
    else if (r === "reset") router.publicView.innerHTML = renderReset(router.params.token);
    else if (r === "onboarding") router.publicView.innerHTML = renderOnboarding();
    else router.publicView.innerHTML = renderLanding();

    if (r === "login") bindLogin();
    if (r === "signup") bindSignup();
    if (r === "forgot") bindForgot();
    if (r === "reset") bindReset(router.params.token);
    if (r === "onboarding") bindOnboarding();

    document.title = ({
      landing: "Remindly — Never forget what matters.",
      login: "Log in · Remindly", signup: "Create account · Remindly",
      forgot: "Reset password · Remindly", reset: "Choose a new password · Remindly",
      onboarding: "Welcome · Remindly"
    })[r] || "Remindly";
    return;
  }

  // ---- app routes
  router.publicView.hidden = true;
  router.appShell.hidden = false;

  $("#pageTitle").textContent = VIEW_TITLES[r] || "Remindly";
  document.title = `Remindly — ${VIEW_TITLES[r] || ""}`;

  $$$$("#nav .nav-item, #bottomnav .bn-item").forEach(b => {
    const active = b.dataset.view === r;
    b.classList.toggle("active", active);
    if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });

  const nameEl = $("#acctName");
  if (nameEl) nameEl.textContent = auth.mode === "guest" ? "Guest" : String(auth.user.displayName).split(/\s+/)[0];
  const avHost = $("#acctAvatar");
  if (avHost) {
    const holder = document.createElement("div");
    holder.innerHTML = avatarHTML(auth.user, "sm");
    const node = holder.firstElementChild;
    node.id = "acctAvatar";
    avHost.replaceWith(node);
  }

  if (r === "dashboard") router.view.innerHTML = renderDashboard();
  else if (r === "reminders") router.view.innerHTML = renderReminders();
  else if (r === "calendar") router.view.innerHTML = renderCalendar();
  else if (r === "completed") router.view.innerHTML = renderCompleted();
  else if (r === "profile") router.view.innerHTML = renderProfile();
  else router.view.innerHTML = renderSettings();

  if (r === "reminders") {
    updateRemindersList();
    const s = $("#searchInput");
    if (s) s.addEventListener("input", e => { store.ui.query = e.target.value; updateRemindersList(); });
    const sort = $("#sortSelect");
    if (sort) sort.addEventListener("change", e => { store.ui.sort = e.target.value; updateRemindersList(); });
    const bar = $("#filterBar");
    if (bar) bar.addEventListener("click", e => {
      const b = e.target.closest("[data-filter]");
      if (!b) return;
      store.ui.filter = b.dataset.filter;
      $$("#filterBar .filter-chip").forEach(x => {
        const on = x.dataset.filter === store.ui.filter;
        x.classList.toggle("active", on);
        x.setAttribute("aria-selected", String(on));
      });
      updateRemindersList();
    });
  }
  if (r === "profile") bindProfile();
  if (r === "settings") bindSettings();

  requestAnimationFrame(() => {
    const ring = ("#ringFill");
    if (ring) {
      const C = 2 * Math.PI * 52;
      const total = store.reminders.length;
      const progress = total ? Math.round((store.reminders.filter(x => x.completed).length / total) * 100) : 0;
      ring.style.strokeDasharray = C;
      if (reduceMotion()) ring.style.strokeDashoffset = C * (1 - progress / 100);
      else setTimeout(() => { ring.style.strokeDashoffset = C * (1 - progress / 100); }, 60);
    }
    const ringNum = $("#ringNum");
    if (ringNum) {
      const total = store.reminders.length;
      animateNumber(ringNum, total ? Math.round((store.reminders.filter(x => x.completed).length / total) * 100) : 0);
    }
    $$$$(".t-metric[data-count]").forEach(el => animateNumber(el, Number(el.dataset.count)));
    $$(".bar i, .pulse-bar i").forEach(el => {
      const w = el.dataset.w + "%";
      if (reduceMotion()) el.style.width = w;
      else requestAnimationFrame(() => { el.style.width = w; });
    });
  });

  updateBadge();
}

function updateBadge() {
  const b = ("#bellBadge");
  if (!b || !auth.user) return;
  const n = store.reminders.filter(r => !r.completed && sched.effective(r) <= Date.now() + 3600000).length;
  b.textContent = String(n);
  b.dataset.zero = n === 0 ? "1" : "0";
}

/* ============================================================ form bindings */
function bindLogin() {
  const form = $("#loginForm");
  if (!form) return;

  const banner = $("#loginBanner");
  if (auth.expiredNotice) {
    auth.expiredNotice = false;
    banner.hidden = false;
    banner.className = "form-banner info";
    banner.innerHTML = `${ICON.clock}<span>Your session expired, so we signed you out for safety. Log in again to pick up where you left off.</span>`;
  } else if (router.params.from) {
    banner.hidden = false;
    banner.className = "form-banner info";
    banner.innerHTML = `${ICON.lock}<span>Please log in to reach that page.</span>`;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector('[type="submit"]');
    btn.classList.add("btn-loading");
    btn.disabled = true;

    ["email", "password"].forEach(n => showFieldError(form, n, ""));
    banner.hidden = true;

    const res = await auth.logIn({ email: form.email.value, password: form.password.value, remember: $("#liRemember").checked });

    btn.classList.remove("btn-loading");
    btn.disabled = false;

    if (!res.ok) {
      Object.entries(res.errors || {}).forEach(([k, v]) => showFieldError(form, k, v));
      if (res.errors && res.errors.form) {
        banner.hidden = false;
        banner.className = "form-banner err";
        banner.innerHTML = `${ICON.alert}<span>${esc(res.errors.form)}</span>`;
      }
      return;
    }

    await bootSession({ silent: true });
    ui.toast(`Welcome back, ${res.user.displayName.split(/\s+/)[0]}`);
  });
}

function bindSignup() {
  const form = $("#signupForm");
  if (!form) return;

  const pw = $("#suPassword");
  const strength = $("#pwStrength");
  pw.addEventListener("input", () => {
    const v = pw.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    strength.className = "pw-strength" + (v ? " s" + score : "");
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector('[type="submit"]');
    ["displayName", "email", "password", "confirm", "terms"].forEach(n => showFieldError(form, n, ""));
    $("#signupBanner").hidden = true;

    if (!$("#suTerms").checked) {
      showFieldError(form, "terms", "Please accept the terms to continue.");
      return;
    }

    btn.classList.add("btn-loading");
    btn.disabled = true;
    const res = await auth.signUp({
      displayName: form.displayName.value,
      email: form.email.value,
      password: form.password.value,
      confirm: form.confirm.value
    });
    btn.classList.remove("btn-loading");
    btn.disabled = false;

    if (!res.ok) {
      Object.entries(res.errors || {}).forEach(([k, v]) => showFieldError(form, k, v));
      if (res.errors && res.errors.form) {
        const banner = $("#signupBanner");
        banner.hidden = false;
        banner.className = "form-banner err";
        banner.innerHTML = `${ICON.alert}<span>${esc(res.errors.form)}</span>`;
      }
      return;
    }

    if (res.needsConfirm) {
      const banner = $("#signupBanner");
      banner.hidden = false;
      banner.className = "form-banner ok";
      banner.innerHTML = `${ICON.check}<span><b>Almost there, ${esc(form.displayName.value.trim().split(/\s+/)[0])}.</b><br>
        We've sent a confirmation link to <b>${esc(res.email)}</b>. Open it to activate your account, then log in.</span>`;
      ui.toast("Check your inbox to confirm your email.", "info");
      return;
    }

    await bootSession({ fresh: true });
    ui.toast("Welcome to Remindly");
  });
}

function bindForgot() {
  const form = $("#forgotForm");
  if (!form) return;
  form.addEventListener("submit", async e => {
    e.preventDefault();
    showFieldError(form, "email", "");
    const banner = $("#forgotBanner");
    banner.hidden = true;

    const res = await auth.forgotPassword(form.email.value);
    if (!res.ok) {
      Object.entries(res.errors || {}).forEach(([k, v]) => showFieldError(form, k, v));
      return;
    }
    banner.hidden = false;
    banner.className = "form-banner ok";
    banner.innerHTML = `${ICON.check}<span>${esc(res.message)}</span>`;
    ui.toast("If that email is registered, a reset link is on its way.", "info");

function bindReset(_token) {
  const form = $("#resetForm");
  if (!form) return;

  (async () => {
    if (sb.configured) {
      const { data } = await sb.client.auth.getSession();
      if (!data || !data.session) {
        const banner = $("#resetBanner");
        banner.hidden = false;
        banner.className = "form-banner info";
        banner.innerHTML = `${ICON.info}<span>Open the secure link from your email to set a new password — this page activates automatically when you do.</span>`;
      }
    }
  })();

  form.addEventListener("submit", async e => {
    e.preventDefault();
    ["password", "confirm", "token"].forEach(n => showFieldError(form, n, ""));
    const btn = form.querySelector('[type="submit"]');
    btn.classList.add("btn-loading");
    btn.disabled = true;

    const res = await auth.resetPassword(_token, form.password.value, form.confirm.value);

    btn.classList.remove("btn-loading");
    btn.disabled = false;

    if (!res.ok) {
      Object.entries(res.errors || {}).forEach(([k, v]) => showFieldError(form, k, v));
      return;
    }
    ui.toast("Password updated. You can log in now.");
    await auth.logOut();
    router.go("login");
  });
}

function bindOnboarding() {
  const stepHost = $("#onboardStep");
  const dots = $$$$(".onboard-steps i");
  const nextBtn = $("#obNext");
  const skipBtn = $("#obSkip");
  let step = 0;
  const uses = new Set();

  const renderStep = () => {
    dots.forEach((d, i) => d.classList.toggle("on", i <= step));
    if (step === 0) {
      stepHost.innerHTML = `
        <h1>Welcome to Remindly 👋</h1>
        <p class="lead">Let's get you set up in a few seconds. You can change anything later in your profile.</p>
        <div class="note">${ICON.info}<div>Reminders, categories and progress all live in your own private account.</div></div>`;
      nextBtn.textContent = "Get started";
    } else if (step === 1) {
      const opts = [
        ["School", ICON.calendar], ["Work", ICON.inbox], ["Personal", ICON.user],
        ["Fitness", ICON.check], ["Important dates", ICON.bell], ["Other", ICON.sparkle]
      ];
      stepHost.innerHTML = `
        <h1>What do you use reminders for?</h1>
        <p class="lead">Pick anything that fits. We'll tune your categories and dashboard to match.</p>
        <div class="use-grid" id="useGrid">
          ${opts.map(([label, ic]) => `
            <button class="use-opt ${uses.has(label) ? "active" : ""}" data-use="${label}">
              <span class="ui">${ic}</span>${label}
            </button>`).join("")}
        </div>`;
      $("#useGrid").addEventListener("click", e => {
        const b = e.target.closest("[data-use]");
        if (!b) return;
        const v = b.dataset.use;
        if (uses.has(v)) uses.delete(v); else uses.add(v);
        b.classList.toggle("active");
      });
      nextBtn.textContent = "Continue";
    } else {
      stepHost.innerHTML = `
        <h1>You're ready!</h1>
        <p class="lead">Your dashboard is set up. Add your first reminder and Remindly will keep track of the rest.</p>
        <div class="note green">${ICON.check}<div><b style="color:var(--ink)">Everything is private to your account</b> and syncs to every device you sign in from.</div></div>`;
      nextBtn.textContent = "Go to my dashboard";
      skipBtn.hidden = true;
    }
  };

  const finish = async () => {
    store.prefs.onboarded = true;
    store.prefs.uses = Array.from(uses);
    await store.persist();
    await auth.updateProfile({ onboarded: true, uses: Array.from(uses) });
    router.go("dashboard");
  };

  nextBtn.addEventListener("click", async () => {
    if (step < 2) { step++; renderStep(); }
    else await finish();
  });
  skipBtn.addEventListener("click", finish);

  renderStep();
}

function bindProfile() {
  const form = $("#profileForm");
  if (form) {
    form.addEventListener("submit", async e => {
      e.preventDefault();
      ["displayName", "email"].forEach(n => showFieldError(form, n, ""));
      const res = await auth.updateProfile({
        displayName: form.displayName.value,
        email: form.email.value
      });
      if (!res.ok) {
        Object.entries(res.errors || {}).forEach(([k, v]) => showFieldError(form, k, v));
        ui.toast("Please check the highlighted fields", "warn");
        return;
      }
      if (res.emailChange) ui.toast("Check your inbox to confirm your new email address.", "info");
      else ui.toast("Profile updated.");
      render();
    });
  }

  const tz = $("#tzSelect");
  if (tz) {
    tz.addEventListener("change", async e => {
      store.prefs.timezone = e.target.value;
      await store.persist();
      await auth.updateProfile({ prefs: { timezone: e.target.value } });
      ui.toast("Time zone updated.");
      render();
    });
  }

  const file = $("#avatarFile");
  if (file) {
    file.addEventListener("change", e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      if (f.size > 150 * 1024) {
        ui.toast("Please choose an image under 150 KB", "warn");

      reader.onload = async () => {
        const res = await auth.updateProfile({ avatar: { type: "image", src: reader.result } });
        ui.toast(res && res.localOnly ? "Profile picture saved on this device." : "Profile picture updated.");
        render();
      };
      reader.readAsDataURL(f);
    });
  }
}
