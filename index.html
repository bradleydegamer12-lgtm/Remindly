<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remindly — Never forget what matters.</title>
<meta name="description" content="Remindly is a calm, time-aware reminder and task manager. See your day on one rail, capture tasks in seconds, and never miss a deadline.">
<meta name="theme-color" content="#F4F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   REMINDLY — design tokens (unchanged design system)
   ============================================================ */
:root{
  --canvas:#F4F5F2; --surface:#FFFFFF; --surface-2:#FAFBF9;
  --ink:#111312; --inv:#F7F8F5; --muted:#6F7470; --line:#D9DDD8; --line-strong:#C7CDC7;
  --glass:rgba(255,255,255,0.72); --amber:#E2B84B; --green:#4E9B73; --coral:#C96455;
  --sky:#5D87A8; --violet:#8372A8;
  --shadow:0 12px 32px rgba(17,19,18,0.08); --shadow-lg:0 20px 60px rgba(17,19,18,0.18);
  --blur:blur(14px) saturate(120%);
  --r-lg:20px; --r-md:12px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px; --s10:80px;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
[data-theme="dark"]{
  --canvas:#101211; --surface:#191C1A; --surface-2:#141715; --ink:#F7F8F5; --inv:#101211;
  --muted:#9AA09B; --line:#343934; --line-strong:#454B45; --glass:rgba(25,28,26,0.78);
  --shadow:0 12px 32px rgba(0,0,0,0.34); --shadow-lg:0 20px 60px rgba(0,0,0,0.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease;overflow-x:hidden}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
::selection{background:var(--amber);color:#111312}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;border:3px solid transparent;background-clip:content-box}

.t-display{font-family:var(--display);font-size:48px;font-weight:500;line-height:.98;letter-spacing:-.02em;margin:0}
.t-heading{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.015em;margin:0}
.t-title{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0}
.t-body{font-size:15px;line-height:1.5;margin:0}
.t-label{font-size:11px;font-weight:600;line-height:1.2;letter-spacing:.06em;text-transform:uppercase}
.t-caption{font-size:12px;line-height:1.35;color:var(--muted)}
.t-metric{font-family:var(--display);font-size:42px;font-weight:500;line-height:.95;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* --------------------------------------------------------- app shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--surface);border-right:1px solid var(--line);
  padding:var(--s7) var(--s5);display:flex;flex-direction:column;gap:var(--s6);z-index:40;
  transition:background-color .3s ease,border-color .3s ease,width .25s var(--ease)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;flex:0 0 auto}
[data-theme="dark"] .brand-mark{background:var(--amber);color:#101211}
.brand-name{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:var(--r-md);
  color:var(--muted);font-size:14px;font-weight:500;width:100%;transition:background-color .14s ease,color .14s ease}
.nav-item svg{width:20px;height:20px;flex:0 0 auto;transition:transform .14s ease}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item:hover svg{transform:translateX(2px)}
.nav-item.active{color:var(--ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--amber)}
[data-theme="dark"] .nav-item:hover{background:#20241f}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:var(--s5)}
.today-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4)}
[data-theme="dark"] .today-card{background:#20241f}
.today-card .t-label{color:var(--muted)}
.today-card strong{font-family:var(--display);font-size:15px;font-weight:600;display:block;margin-top:6px;letter-spacing:-.01em}

.main{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:72px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s8);
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
[data-theme="dark"] .topbar{background:rgba(16,18,17,.72)}
.topbar-title{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em}
.topbar-spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--muted);
  border:1px solid transparent;position:relative;transition:background-color .14s ease,color .14s ease,border-color .14s ease}
.icon-btn:hover{background:var(--surface);color:var(--ink);border-color:var(--line)}
.icon-btn svg{width:20px;height:20px}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--coral);
  color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1;border:2px solid var(--canvas)}
.badge[data-zero="1"]{display:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--canvas);display:grid;place-items:center;
  font-size:13px;font-weight:600;flex:0 0 auto;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
[data-theme="dark"] .avatar{background:var(--amber);color:#111312}
.avatar.lg{width:76px;height:76px;font-size:24px}
.avatar.sm{width:30px;height:30px;font-size:11px}

.acct{position:relative}
.acct-btn{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px 0 8px;border-radius:var(--r-pill);
  border:1px solid var(--line);transition:all .14s ease}
.acct-btn:hover{border-color:var(--line-strong);background:var(--surface)}
.acct-name{font-size:14px;font-weight:600;letter-spacing:-.01em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn svg{width:16px;height:16px;color:var(--muted)}
.dropdown{position:absolute;right:0;top:calc(100% + 10px);width:250px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:var(--s2);z-index:70;animation:rise .16s var(--ease) both}
.dd-head{padding:var(--s4);border-bottom:1px solid var(--line);margin-bottom:var(--s2)}
.dd-head b{display:block;font-size:14px;letter-spacing:-.01em}
.dd-item{display:flex;align-items:center;gap:11px;width:100%;height:42px;padding:0 12px;border-radius:var(--r-md);
  font-size:14px;font-weight:500;color:var(--muted);transition:all .14s ease;text-align:left}
.dd-item svg{width:18px;height:18px}
.dd-item:hover{background:var(--surface-2);color:var(--ink)}
.dd-item.danger:hover{background:rgba(201,100,85,.1);color:var(--coral)}
.dd-sep{height:1px;background:var(--line);margin:var(--s2) 0}

.content{width:100%;max-width:1280px;margin:0 auto;padding:var(--s8) var(--s8) var(--s10);flex:1}
.bottomnav{display:none}

/* --------------------------------------------------------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 24px;border-radius:var(--r-pill);
  font-size:15px;font-weight:600;letter-spacing:-.01em;transition:transform .14s ease,background-color .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.btn-primary{background:var(--ink);color:var(--canvas)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(17,19,18,.18)}
.btn-primary:active{transform:translateY(0) scale(.98)}
[data-theme="dark"] .btn-primary{background:var(--inv);color:#111312}
.btn-ghost{border:1px solid var(--line-strong);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--surface);border-color:var(--ink);transform:translateY(-2px)}
.btn-danger{background:var(--coral);color:#fff}
.btn-danger:hover{transform:translateY(-2px)}
.btn-sm{height:40px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-loading{position:relative;color:transparent !important}
.btn-loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;color:var(--canvas)}
[data-theme="dark"] .btn-loading::after{color:#111312}
@keyframes spin{to{transform:rotate(360deg)}}

.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
[data-theme="dark"] .chip{background:#22261f}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.cat-school{color:#33506b;border-color:rgba(93,135,168,.36);background:rgba(93,135,168,.10)}
.chip.cat-work{color:#4e4270;border-color:rgba(131,114,168,.36);background:rgba(131,114,168,.10)}
.chip.cat-personal{color:#2f6248;border-color:rgba(78,155,115,.36);background:rgba(78,155,115,.10)}
.chip.cat-important{color:#8c3d31;border-color:rgba(201,100,85,.36);background:rgba(201,100,85,.10)}
.chip.cat-other{color:var(--muted)}
[data-theme="dark"] .chip.cat-school{color:#a8c6de}
[data-theme="dark"] .chip.cat-work{color:#c3b6de}
[data-theme="dark"] .chip.cat-personal{color:#9ed4b6}
[data-theme="dark"] .chip.cat-important{color:#e8a99e}
.chip.prio-urgent{background:var(--coral);border-color:var(--coral);color:#fff}
.chip.prio-high{color:#8c3d31;border-color:rgba(201,100,85,.45);background:rgba(201,100,85,.12)}
.chip.prio-medium{color:#7a5c14;border-color:rgba(226,184,75,.5);background:rgba(226,184,75,.13)}
.chip.prio-low{color:var(--muted)}
[data-theme="dark"] .chip.prio-high{color:#e8a99e}
[data-theme="dark"] .chip.prio-medium{color:#e5c77e}
.chip.done{color:#2f6248;border-color:rgba(78,155,115,.4);background:rgba(78,155,115,.12)}
[data-theme="dark"] .chip.done{color:#9ed4b6}
.chip.snoozed{color:#33506b;border-color:rgba(93,135,168,.45);background:rgba(93,135,168,.12)}
[data-theme="dark"] .chip.snoozed{color:#a8c6de}
.chip.guest{color:#7a5c14;border-color:rgba(226,184,75,.5);background:rgba(226,184,75,.14)}
[data-theme="dark"] .chip.guest{color:#e5c77e}

.filter-chip{height:38px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;
  color:var(--muted);font-size:13px;font-weight:600;transition:all .14s ease;white-space:nowrap}
.filter-chip:hover{color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px)}
.filter-chip.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
[data-theme="dark"] .filter-chip.active{background:var(--inv);color:#111312}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,select.input,textarea.input{width:100%;height:48px;padding:0 15px;border-radius:var(--r-md);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;transition:border-color .14s ease,box-shadow .14s ease,background-color .2s ease}
textarea.input{height:auto;min-height:92px;padding:13px 15px;line-height:1.5;resize:vertical;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(93,135,168,.18)}
.input::placeholder{color:var(--muted);opacity:.75}
.input.invalid{border-color:var(--coral);box-shadow:0 0 0 3px rgba(201,100,85,.14)}
.field-error{color:var(--coral);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;min-height:0}
.field-error svg{width:13px;height:13px;flex:0 0 auto}
.field-hint{color:var(--muted);font-size:12px}
select.input{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

.switch{position:relative;width:50px;height:28px;border-radius:999px;flex:0 0 auto;background:var(--line-strong);transition:background-color .18s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .18s var(--ease)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.seg{display:inline-flex;padding:4px;gap:4px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-2)}
[data-theme="dark"] .seg{background:#22261f}
.seg button{height:34px;padding:0 15px;border-radius:var(--r-pill);font-size:12px;font-weight:600;color:var(--muted);transition:all .14s ease}
.seg button.active{background:var(--ink);color:var(--canvas)}
[data-theme="dark"] .seg button.active{background:var(--inv);color:#111312}

/* --------------------------------------------------------- cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s var(--ease)}
.card-glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
[data-theme="dark"] .card-glass{background:rgba(25,28,26,.78)}
.card-hover:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s5)}
.section-head .t-label{color:var(--muted);display:block;margin-bottom:6px}

/* --------------------------------------------------------- hero */
.grid-hero{display:grid;grid-template-columns:2fr 1fr;gap:var(--s6);margin-bottom:var(--s7)}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:#101211;color:#F7F8F5;padding:var(--s8);
  min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s6)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='24' height='24' filter='url(%23n)'/></svg>")}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s6);position:relative;z-index:1}
.hero-eyebrow{color:#9AA09B;letter-spacing:.14em;margin:0 0 14px}
.hero h1{font-family:var(--display);font-size:48px;font-weight:500;line-height:.98;letter-spacing:-.025em;margin:0}
.hero-sum{color:#C9CCC8;margin-top:14px;max-width:44ch;font-size:15px}
.hero-actions{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;position:relative;z-index:1}
.btn-inv{background:#F7F8F5;color:#111312}
.btn-inv:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.32)}
.btn-onblack{border:1px solid rgba(247,248,245,.28);color:#F7F8F5}
.btn-onblack:hover{background:rgba(247,248,245,.1);transform:translateY(-2px)}
.hero-live{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9AA09B}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,184,75,.5)}70%{box-shadow:0 0 0 9px rgba(226,184,75,0)}100%{box-shadow:0 0 0 0 rgba(226,184,75,0)}}
.ring-wrap{position:relative;width:148px;height:148px;flex:0 0 auto}
.ring{width:148px;height:148px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring-track{stroke:rgba(247,248,245,.16)}
.ring-fill{stroke:var(--amber);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .62s ease-out}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-center b{font-family:var(--display);font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em;display:block}
.ring-center span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA09B;margin-top:6px;display:block}

.next-card{display:flex;flex-direction:column;padding:var(--s6);position:relative;overflow:hidden}
.next-card::before{content:"";position:absolute;left:0;top:var(--s6);bottom:var(--s6);width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.next-flag{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.next-time{font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.05;margin:var(--s4) 0 2px}
.next-title{margin:10px 0 8px}
.next-notes{color:var(--muted);font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next-foot{margin-top:auto;padding-top:var(--s5);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);border-top:1px solid var(--line)}
.countdown{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.countdown .cd-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 2.4s infinite}

/* --------------------------------------------------------- metrics */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;background:var(--surface);margin-bottom:var(--s7)}
.metric{padding:var(--s6);border-right:1px solid var(--line);position:relative}
.metric:last-child{border-right:0}
.metric .t-label{color:var(--muted);display:flex;align-items:center;gap:7px}
.metric .t-metric{margin:14px 0 6px;transition:color .3s ease}
.metric.alert .t-metric{color:var(--coral)}
.metric.good .t-metric{color:var(--green)}
.metric .bar{height:3px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.metric .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:2px;transition:width .5s var(--ease)}
.metric.alert .bar i{background:var(--coral)}
.metric.good .bar i{background:var(--green)}

.grid-lower{display:grid;grid-template-columns:2fr 1fr;gap:var(--s6);align-items:start}
.stack-col{display:flex;flex-direction:column;gap:var(--s6)}

/* --------------------------------------------------------- rail */
.rail{padding:var(--s6)}
.rail-body{position:relative;margin-top:var(--s5)}
.rail-line{position:absolute;left:78px;top:6px;bottom:6px;width:1px;background:var(--line)}
.rail-row{position:relative;display:flex;align-items:flex-start;gap:var(--s4);min-height:58px}
.rail-hour{width:64px;flex:0 0 auto;text-align:right;padding-top:1px}
.rail-tick{width:14px;flex:0 0 auto;display:flex;justify-content:center;padding-top:6px}
.rail-tick i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--canvas);display:block}
.rail-row.has .rail-tick i{background:var(--amber);border-color:var(--amber);width:9px;height:9px}
.rail-slot{flex:1;min-width:0;padding-bottom:var(--s3)}
.rail-blank{height:22px;border-radius:8px;background:repeating-linear-gradient(90deg,transparent,transparent 6px,var(--line) 6px,var(--line) 7px);opacity:.5;max-width:120px}
.rail-node{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);padding:11px var(--s4);transition:all .14s ease}
[data-theme="dark"] .rail-node{background:#22261f}
.rail-node:hover{border-color:var(--line-strong);transform:translateX(3px)}
.rail-node .ndot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.rail-node .ntitle{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-node .ntime{margin-left:auto;flex:0 0 auto;color:var(--muted)}
.rail-node.is-done{opacity:.5}
.rail-node.is-done .ntitle{text-decoration:line-through}
.rail-now{position:absolute;left:78px;right:0;height:2px;background:var(--amber);border-radius:2px;z-index:2}
.rail-now::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.rail-now span{position:absolute;right:0;top:-22px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#111312;background:var(--amber);padding:2px 7px;border-radius:999px}

.pulse-row{display:flex;flex-direction:column;gap:8px;padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.pulse-row:last-child{border-bottom:0}
.pulse-top{display:flex;align-items:center;gap:10px}
.pulse-top .dot{width:9px;height:9px;border-radius:3px}
.pulse-top b{font-size:14px;font-weight:600}
.pulse-top .cnt{margin-left:auto;font-family:var(--display);font-size:17px;font-weight:600}
.pulse-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pulse-bar i{display:block;height:100%;border-radius:2px;width:0;transition:width .5s var(--ease)}

.mini{display:flex;flex-direction:column;gap:var(--s2)}
.mini-row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:11px var(--s3);border-radius:var(--r-md);
  border:1px solid transparent;transition:all .14s ease}
.mini-row:hover{background:var(--surface-2);border-color:var(--line)}
[data-theme="dark"] .mini-row:hover{background:#22261f}
.mini-row .mtime{font-family:var(--display);font-size:13px;font-weight:600;width:58px;flex:0 0 auto;letter-spacing:-.01em}
.mini-row .mtitle{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .mmeta{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap}
.mini-row .mdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.mini-row.done .mtitle{opacity:.55;text-decoration:line-through}

/* --------------------------------------------------------- reminder cards */
.list{display:flex;flex-direction:column;gap:var(--s3)}
.rcard{display:flex;gap:var(--s4);align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s5);position:relative;overflow:hidden;
  transition:border-color .18s ease,transform .18s var(--ease),background-color .18s ease}
.rcard:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.rcard.overdue{border-color:rgba(201,100,85,.42)}
.rcard.is-done{opacity:.62}
.rcard.is-done .rc-title{text-decoration:line-through;text-decoration-thickness:1px}
.rcard.is-done .rc-notes{display:none}
.rcard.pending{opacity:.72}
.rcard.failed{border-color:rgba(201,100,85,.5)}
.check{width:24px;height:24px;flex:0 0 auto;margin-top:2px;border-radius:8px;border:1.75px solid var(--line-strong);display:grid;
  place-items:center;transition:all .16s var(--ease);position:relative}
.check::before{content:"";position:absolute;inset:-12px}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.6);transition:all .16s var(--ease)}
.check:hover{border-color:var(--green)}
.check[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.check[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.rc-main{flex:1;min-width:0}
.rc-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.rc-title{font-size:17px;font-weight:600;letter-spacing:-.012em;margin:0;word-break:break-word}
.rc-notes{color:var(--muted);font-size:14px;line-height:1.5;margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s4);margin-top:12px}
.rc-meta span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rc-meta svg{width:14px;height:14px}
.rc-meta .due-hot{color:var(--coral);font-weight:600}
.rc-meta .due-warm{color:#8a6a12;font-weight:600}
[data-theme="dark"] .rc-meta .due-warm{color:#e5c77e}
.rc-actions{display:flex;gap:2px;flex:0 0 auto;opacity:0;transition:opacity .14s ease}
.rcard:hover .rc-actions,.rcard:focus-within .rc-actions{opacity:1}
.rc-actions .icon-btn{width:38px;height:38px;border-radius:10px}
.rc-actions .icon-btn.del:hover{background:rgba(201,100,85,.12);color:var(--coral);border-color:rgba(201,100,85,.3)}
.rc-more{display:none}
@keyframes dawnIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sweep{animation:dawnIn .52s var(--ease) both}
.sweep::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(226,184,75,.42),transparent);width:40%;animation:scan .52s var(--ease) both}

.toolbar{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s5)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap}
.result-count{margin:0 0 var(--s4);color:var(--muted);font-size:13px}

.empty{text-align:center;padding:var(--s9) var(--s6);border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:var(--surface)}
.empty .ei{width:52px;height:52px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto var(--s5);color:var(--muted)}
[data-theme="dark"] .empty .ei{background:#22261f}
.empty h3{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 10px}
.empty p{color:var(--muted);margin:0 auto var(--s6);max-width:38ch;font-size:14px}

.alert{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5);border:1px solid rgba(201,100,85,.4);
  background:rgba(201,100,85,.08);border-radius:var(--r-lg);margin-bottom:var(--s6)}
.alert svg{width:22px;height:22px;color:var(--coral);flex:0 0 auto}
.alert b{color:var(--coral)}
.alert .btn{margin-left:auto}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s5);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface-2);color:var(--muted);font-size:13px;line-height:1.55}
[data-theme="dark"] .note{background:#22261f}
.note svg{width:18px;height:18px;flex:0 0 auto;color:var(--sky);margin-top:1px}
.note.amber{border-color:rgba(226,184,75,.45);background:rgba(226,184,75,.1)}
.note.amber svg{color:var(--amber)}
.note.green{border-color:rgba(78,155,115,.4);background:rgba(78,155,115,.1)}
.note.green svg{color:var(--green)}

/* --------------------------------------------------------- calendar */
.cal-grid-wrap{display:grid;grid-template-columns:7fr 5fr;gap:var(--s6);align-items:start}
.cal-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5);flex-wrap:wrap}
.cal-title{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.cal-dow span{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{min-height:82px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:9px 10px;
  text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .14s ease;position:relative}
.cal-day:hover{border-color:var(--ink);transform:translateY(-2px)}
.cal-day .dnum{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:-.01em}
.cal-day.out{opacity:.5;background:transparent;border-style:dashed}
.cal-day.today{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cal-day.today .dnum{color:#8a6a12}
[data-theme="dark"] .cal-day.today .dnum{color:var(--amber)}
.cal-day.sel{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.cal-day.has-overdue::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--surface)}
.cal-day.sel.has-overdue::after{box-shadow:0 0 0 2px var(--ink)}
.cal-dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.cal-dot{width:7px;height:7px;border-radius:50%;border:1px solid transparent}
.cal-dot.rep{border-radius:2px}
.cal-more{font-size:10px;font-weight:700;color:var(--muted)}
.day-panel{position:sticky;top:96px}

/* --------------------------------------------------------- settings/profile */
.settings-wrap{max-width:760px}
.set-section{margin-bottom:var(--s7)}
.set-section > .t-label{color:var(--muted);display:block;margin-bottom:var(--s3);padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.set-row{display:flex;align-items:center;gap:var(--s5);padding:var(--s5) 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .rt{flex:1;min-width:0}
.set-row .rt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.set-row .rt span{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.45}
.set-row .rc{flex:0 0 auto;display:flex;gap:var(--s2);align-items:center}
.set-row .input{width:180px;height:42px}

.profile-grid{display:grid;grid-template-columns:auto 1fr;gap:var(--s6);align-items:center;margin-bottom:var(--s6)}
.avatar-pick{display:flex;gap:var(--s2);flex-wrap:wrap}
.avatar-opt{width:44px;height:44px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:#fff;transition:all .14s ease}
.avatar-opt:hover{transform:translateY(-2px)}
.avatar-opt.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface)}

/* --------------------------------------------------------- modal */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(12,14,13,.44);-webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:var(--s5);animation:fade .18s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);animation:rise .18s var(--ease) both;max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:620px}
.modal-head{display:flex;align-items:center;gap:var(--s4);padding:var(--s6);border-bottom:1px solid var(--line)}
.modal-head h2{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;flex:1}
.modal-body{padding:var(--s6);overflow-y:auto;display:flex;flex-direction:column;gap:var(--s5)}
.modal-foot{padding:var(--s5) var(--s6);border-top:1px solid var(--line);display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.opt-row{display:flex;flex-wrap:wrap;gap:var(--s2)}
.opt{height:40px;padding:0 15px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--muted);transition:all .14s ease;display:inline-flex;align-items:center;gap:7px}
.opt:hover{border-color:var(--line-strong);color:var(--ink)}
.opt.active{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
[data-theme="dark"] .opt.active{background:var(--inv);color:#111312}
.opt .sw{width:11px;height:11px;border-radius:50%}
.confirm{max-width:410px}

.toasts{position:fixed;right:var(--s6);bottom:var(--s6);z-index:100;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:11px;padding:13px 18px;border-radius:var(--r-pill);background:#111312;color:#F7F8F5;
  font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .28s var(--ease) both;max-width:min(92vw,380px);pointer-events:auto}
.toast.out{animation:toastOut .22s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
.toast svg{width:18px;height:18px;flex:0 0 auto}
.toast.ok svg{color:#7dd0a2}
.toast.warn svg{color:#e8a99e}
.toast.info svg{color:var(--amber)}

.notif-stack{position:fixed;left:var(--s6);bottom:var(--s6);z-index:95;display:flex;flex-direction:column;gap:var(--s3);
  width:min(92vw,380px);pointer-events:none}
.notif-card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:var(--s5);animation:rise .28s var(--ease) both;position:relative;overflow:hidden}
.notif-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.notif-card.warn::before{background:var(--coral)}
.nc-head{display:flex;align-items:flex-start;gap:var(--s3)}
.nc-head b{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.nc-time{font-family:var(--display);font-size:15px;font-weight:600;flex:0 0 auto}
.nc-sub{color:var(--muted);font-size:12px;margin-top:5px}
.nc-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.nc-btn{height:36px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--line);font-size:12px;font-weight:600;
  color:var(--muted);transition:all .14s ease}
.nc-btn:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-1px)}
.nc-btn.primary{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
[data-theme="dark"] .nc-btn.primary{background:var(--inv);color:#111312}
.nc-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.nc-close:hover{background:var(--surface-2);color:var(--ink)}
.nc-close svg{width:15px;height:15px}

.view-in{animation:viewIn .18s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateX(var(--dir,12px))}to{opacity:1;transform:translateX(0)}}

.ai-hint{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:var(--r-md);border:1px dashed var(--line-strong);
  background:var(--surface-2);color:var(--muted);font-size:13px;cursor:pointer;transition:all .14s ease;width:100%;text-align:left}
[data-theme="dark"] .ai-hint{background:#22261f}
.ai-hint:hover{border-color:var(--sky);color:var(--ink)}
.ai-hint svg{width:16px;height:16px;color:var(--amber);flex:0 0 auto}
.ai-preview{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ai-preview .pv{display:flex;gap:var(--s4);padding:13px var(--s5);border-bottom:1px solid var(--line);align-items:flex-start}
.ai-preview .pv:last-child{border-bottom:0}
.ai-preview .pv .k{width:92px;flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.ai-preview .pv .v{font-size:14px;font-weight:500;line-height:1.45}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px}

/* ============================================================
   PUBLIC — landing page + auth screens (unchanged)
   ============================================================ */
.public{min-height:100vh;display:flex;flex-direction:column}
.lnav{height:76px;display:flex;align-items:center;gap:var(--s5);padding:0 clamp(var(--s5),5vw,var(--s9));border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:sticky;top:0;z-index:20}
.lnav .brand-name{font-size:21px}
.lnav-links{display:flex;gap:var(--s6);margin-left:var(--s8)}
.lnav-links a{font-size:14px;font-weight:500;color:var(--muted);transition:color .14s ease}
.lnav-links a:hover{color:var(--ink)}
.lnav-actions{margin-left:auto;display:flex;gap:var(--s3);align-items:center}

.lhero{background:#101211;color:#F7F8F5;padding:clamp(var(--s9),9vw,110px) clamp(var(--s5),5vw,var(--s9));position:relative;overflow:hidden}
.lhero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='24' height='24' filter='url(%23n)'/></svg>")}
.lhero-inner{max-width:1280px;margin:0 auto;position:relative;z-index:1}
.lhero h1{font-family:var(--display);font-size:clamp(52px,9vw,116px);font-weight:500;line-height:.92;letter-spacing:-.035em;margin:0}
.lhero h2{font-family:var(--display);font-size:clamp(26px,4.2vw,54px);font-weight:500;line-height:1.02;letter-spacing:-.03em;margin:var(--s5) 0 0;color:var(--amber)}
.lhero p{color:#C9CCC8;font-size:clamp(16px,2vw,21px);margin:var(--s6) 0 0;max-width:34ch;line-height:1.5}
.lhero-actions{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s8)}
.lhero-strip{display:flex;flex-wrap:wrap;gap:var(--s7);margin-top:var(--s10);padding-top:var(--s7);border-top:1px solid rgba(247,248,245,.16)}
.lhero-strip div b{display:block;font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em}
.lhero-strip div span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9AA09B}

.lsection{padding:clamp(var(--s9),8vw,104px) clamp(var(--s5),5vw,var(--s9));max-width:1280px;margin:0 auto;width:100%}
.lsection-head{max-width:56ch;margin-bottom:var(--s8)}
.lsection-head h2{font-family:var(--display);font-size:clamp(30px,4.4vw,50px);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:var(--s3) 0 0}
.lsection-head p{color:var(--muted);margin:var(--s5) 0 0;font-size:17px;line-height:1.55}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5)}
.feat{padding:var(--s7);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);transition:all .18s var(--ease)}
.feat:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:var(--shadow)}
.feat .fi{width:44px;height:44px;border-radius:13px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;margin-bottom:var(--s5)}
[data-theme="dark"] .feat .fi{background:var(--amber);color:#111312}
.feat .fi svg{width:21px;height:21px}
.feat h3{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
.feat p{color:var(--muted);margin:0;font-size:14px;line-height:1.55}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s5);counter-reset:step}
.step{padding:var(--s7);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);position:relative;counter-increment:step}
.step::before{content:"0" counter(step);font-family:var(--display);font-size:15px;font-weight:600;color:var(--amber);letter-spacing:.08em;display:block;margin-bottom:var(--s5)}
.step h3{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
.step p{color:var(--muted);margin:0;font-size:14px;line-height:1.55}
.step-line{height:1px;background:var(--line);margin:var(--s6) 0 0}
.lcta{background:#101211;color:#F7F8F5;border-radius:var(--r-lg);padding:clamp(var(--s8),7vw,var(--s10));text-align:center;margin:0 auto clamp(var(--s8),7vw,var(--s10));max-width:1180px}
.lcta h2{font-family:var(--display);font-size:clamp(32px,5.4vw,62px);font-weight:500;letter-spacing:-.03em;line-height:1;margin:0 0 var(--s6)}
.lcta p{color:#C9CCC8;max-width:44ch;margin:0 auto var(--s8);font-size:17px}
.lfooter{border-top:1px solid var(--line);padding:var(--s7) clamp(var(--s5),5vw,var(--s9));display:flex;flex-wrap:wrap;gap:var(--s5);
  align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;width:100%}

.auth-wrap{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.auth-side{background:#101211;color:#F7F8F5;padding:clamp(var(--s7),5vw,var(--s9));display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='24' height='24' filter='url(%23n)'/></svg>")}
.auth-side .brand-mark{background:var(--amber);color:#111312}
.auth-side h2{font-family:var(--display);font-size:clamp(30px,3.6vw,50px);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:var(--s7) 0 var(--s5)}
.auth-side p{color:#C9CCC8;font-size:16px;line-height:1.6;max-width:38ch}
.auth-points{display:flex;flex-direction:column;gap:var(--s4);margin-top:var(--s8);position:relative;z-index:1}
.auth-point{display:flex;gap:var(--s4);align-items:flex-start}
.auth-point .pi{width:30px;height:30px;border-radius:9px;border:1px solid rgba(247,248,245,.24);display:grid;place-items:center;flex:0 0 auto}
.auth-point .pi svg{width:15px;height:15px;color:var(--amber)}
.auth-point b{display:block;font-size:14px;font-weight:600}
.auth-point span{display:block;color:#9AA09B;font-size:13px;line-height:1.5;margin-top:2px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:clamp(var(--s6),5vw,var(--s9))}
.auth-form{width:100%;max-width:440px;animation:viewIn .22s var(--ease) both}
.auth-form h1{font-family:var(--display);font-size:clamp(28px,3.4vw,38px);font-weight:500;letter-spacing:-.028em;line-height:1.06;margin:0 0 var(--s3)}
.auth-form > p.t-body{color:var(--muted);margin-bottom:var(--s7)}
.auth-form form{display:flex;flex-direction:column;gap:var(--s5)}
.auth-foot{margin-top:var(--s6);text-align:center;font-size:14px;color:var(--muted)}
.auth-foot a{font-weight:600;color:var(--ink);border-bottom:1px solid var(--line-strong);padding-bottom:1px}
.auth-foot a:hover{border-color:var(--ink)}
.divider{display:flex;align-items:center;gap:var(--s4);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.social-btn{display:flex;align-items:center;justify-content:center;gap:11px;height:50px;border-radius:var(--r-pill);
  border:1px solid var(--line-strong);font-size:15px;font-weight:600;transition:all .14s ease;background:var(--surface)}
.social-btn:hover{border-color:var(--ink);transform:translateY(-2px)}
.social-btn svg{width:19px;height:19px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:52px}
.pw-eye{position:absolute;right:6px;top:6px;width:38px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.pw-eye:hover{background:var(--surface-2);color:var(--ink)}
.pw-eye svg{width:18px;height:18px}
.pw-strength{display:flex;gap:5px;margin-top:2px}
.pw-strength i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background-color .2s ease}
.pw-strength.s1 i:nth-child(1){background:var(--coral)}
.pw-strength.s2 i:nth-child(-n+2){background:var(--amber)}
.pw-strength.s3 i:nth-child(-n+3){background:var(--amber)}
.pw-strength.s4 i{background:var(--green)}
.form-banner{display:flex;gap:var(--s3);align-items:flex-start;padding:13px 15px;border-radius:var(--r-md);font-size:13px;line-height:1.5;border:1px solid}
.form-banner svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px}
.form-banner.err{background:rgba(201,100,85,.1);border-color:rgba(201,100,85,.4);color:#8c3d31}
.form-banner.ok{background:rgba(78,155,115,.1);border-color:rgba(78,155,115,.4);color:#2f6248}
.form-banner.info{background:rgba(93,135,168,.1);border-color:rgba(93,135,168,.4);color:#33506b}
[data-theme="dark"] .form-banner.err{color:#e8a99e}
[data-theme="dark"] .form-banner.ok{color:#9ed4b6}
[data-theme="dark"] .form-banner.info{color:#a8c6de}

/* onboarding */
.onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(var(--s6),5vw,var(--s9));max-width:720px;margin:0 auto;width:100%}
.onboard-steps{display:flex;gap:var(--s2);margin-bottom:var(--s8)}
.onboard-steps i{height:3px;flex:1;border-radius:2px;background:var(--line);transition:background-color .3s ease}
.onboard-steps i.on{background:var(--amber)}
.onboard h1{font-family:var(--display);font-size:clamp(32px,5vw,54px);font-weight:500;letter-spacing:-.03em;line-height:1.02;margin:0 0 var(--s4)}
.onboard p.lead{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 var(--s7);max-width:48ch}
.onboard-actions{display:flex;gap:var(--s4);align-items:center;margin-top:var(--s8);flex-wrap:wrap}
.use-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.use-opt{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3);padding:var(--s5);border:1px solid var(--line);
  border-radius:var(--r-lg);background:var(--surface);text-align:left;transition:all .16s var(--ease);font-size:15px;font-weight:600}
.use-opt:hover{border-color:var(--ink);transform:translateY(-2px)}
.use-opt.active{border-color:var(--ink);background:var(--ink);color:var(--canvas)}
[data-theme="dark"] .use-opt.active{background:var(--inv);color:#111312}
.use-opt .ui{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
[data-theme="dark"] .use-opt .ui{background:#22261f}
.use-opt.active .ui{background:rgba(247,248,245,.16);color:inherit}

/* splash + status bars */
.splash{position:fixed;inset:0;z-index:200;background:var(--canvas);display:grid;place-items:center;transition:opacity .32s ease}
.splash.out{opacity:0;pointer-events:none}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:var(--s5)}
.splash .brand-mark{width:52px;height:52px;border-radius:15px}
.splash-bar{width:150px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;background:var(--amber);animation:slide 1.1s var(--ease) infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.netbar{position:fixed;top:0;left:0;right:0;z-index:90;padding:10px 16px;text-align:center;font-size:12px;font-weight:600;
  letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:9px}
.netbar.offline{background:var(--coral);color:#fff}
.netbar.syncing{background:var(--amber);color:#111312}
.netbar.synced{background:var(--green);color:#fff}
.netbar svg{width:15px;height:15px}

.loading-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);
  padding:var(--s9) var(--s6);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);text-align:center}
.loading-card .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--amber);animation:spin .8s linear infinite}

/* --------------------------------------------------------- responsive */
@media (max-width:1023px){
  .sidebar{width:72px;padding:var(--s6) 12px;align-items:center}
  .brand-name,.brand-sub,.nav-label,.sidebar-foot{display:none}
  .nav-item{justify-content:center;padding:0}
  .nav-item.active::before{left:-12px}
  .main{margin-left:72px}
  .content{padding:var(--s6) var(--s6) var(--s10)}
  .topbar{padding:0 var(--s6)}
  .grid-hero{grid-template-columns:1fr}
  .grid-lower{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(3,1fr)}
  .metric{border-bottom:1px solid var(--line)}
  .metric:nth-child(3n){border-right:0}
  .metric:nth-last-child(-n+2){border-bottom:0}
  .hero h1{font-size:38px}
  .cal-grid-wrap{grid-template-columns:1fr}
  .day-panel{position:static}
  .feat-grid{grid-template-columns:repeat(2,1fr)}
  .steps-grid{grid-template-columns:repeat(2,1fr)}
  .auth-wrap{grid-template-columns:1fr}
  .auth-side{display:none}
  .lnav-links{display:none}
  .acct-name{display:none}
}
@media (max-width:767px){
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{height:64px;padding:0 var(--s4);gap:var(--s2)}
  .topbar-title{font-size:18px}
  .content{padding:var(--s5) var(--s4) 104px}
  .t-display,.hero h1{font-size:34px}
  .t-heading{font-size:22px}
  .hero{padding:var(--s6);min-height:0}
  .hero-top{flex-direction:column-reverse;align-items:flex-start;gap:var(--s5)}
  .ring-wrap,.ring{width:112px;height:112px}
  .ring-center b{font-size:28px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric{padding:var(--s5);border-right:1px solid var(--line)}
  .metric:nth-child(2n){border-right:0}
  .metric:nth-child(3n){border-right:1px solid var(--line)}
  .metric:nth-last-child(-n+2){border-bottom:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric .t-metric{font-size:34px}
  .grid-hero,.grid-lower{gap:var(--s4);margin-bottom:var(--s6)}
  .cal-day{min-height:58px;padding:6px}
  .cal-day .dnum{font-size:13px}
  .cal-dot{width:5px;height:5px}
  .cal-more{display:none}
  .rc-actions{display:none}
  .rc-more{display:grid}
  .rcard.open .rc-actions{display:flex;opacity:1;position:absolute;right:var(--s5);top:var(--s5);background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r-md);padding:4px;box-shadow:var(--shadow);z-index:3}
  .rail-line,.rail-now{left:56px}
  .rail-hour{width:44px;font-size:11px}
  .rail-now span{top:-20px;font-size:9px}
  .btn{height:50px;width:100%}
  .btn-sm,.btn.inline{width:auto}
  .modal-foot .btn{width:100%}
  .modal-foot{flex-direction:column-reverse}
  .form-2{grid-template-columns:1fr}
  .toolbar{gap:var(--s2)}
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .search-wrap{width:100%;flex:1 1 100%}
  .toasts{right:var(--s4);left:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}
  .notif-stack{left:var(--s4);right:var(--s4);width:auto;bottom:calc(84px + env(safe-area-inset-bottom))}
  .set-row{flex-wrap:wrap;gap:var(--s3)}
  .set-row .input{width:100%}
  .set-row .rc{width:100%}
  .feat-grid,.steps-grid,.use-grid{grid-template-columns:1fr}
  .lhero-strip{gap:var(--s5)}
  .profile-grid{grid-template-columns:1fr}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;
    height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
  .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:10px;font-weight:600;position:relative;transition:color .14s ease}
  .bn-item svg{width:22px;height:22px}
  .bn-item.active{color:var(--ink)}
  .bn-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--amber)}
  .fab{position:fixed;right:var(--s4);bottom:calc(88px + env(safe-area-inset-bottom));z-index:55;width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:var(--canvas);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
  [data-theme="dark"] .fab{background:var(--inv);color:#111312}
  .fab svg{width:24px;height:24px}
}
@media (min-width:768px){.fab{display:none}}
@media (max-width:400px){
  .metrics{grid-template-columns:1fr}
  .metric{border-right:0 !important;border-bottom:1px solid var(--line) !important}
  .metric:last-child{border-bottom:0 !important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .sweep::after{display:none}
}

const sb = {
  client: null,
  configured: false,
  reason: null,          // 'SDK' | 'CONFIG'
  sdkLoaded: false,

  /** Loads the SDK from CDN if the <script> tag was blocked. */
  loadSDK() {
    return new Promise(resolve => {
      if (window.supabase && window.supabase.createClient) { this.sdkLoaded = true; return resolve(true); }
      if (this.sdkLoaded) return resolve(false);
      const s = document.createElement("script");
      s.src = "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js";
      s.async = true;
      s.onload = () => { this.sdkLoaded = Boolean(window.supabase && window.supabase.createClient); resolve(this.sdkLoaded); };
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  },

  /** Creates the client from environment configuration. */
  init() {
    const env = window.REMINDLY_ENV || {};
    const url = String(env.SUPABASE_URL || SUPABASE_URL || "").trim();
    const key = String(env.SUPABASE_ANON_KEY || SUPABASE_ANON_KEY || "").trim();

    if (!(window.supabase && window.supabase.createClient)) { this.reason = "SDK"; return false; }

    const isPlaceholder = v =>
      !v || /^(SUPABASE_URL|SUPABASE_ANON_KEY|YOUR_.*|<.*>)/i.test(v) || /YOUR_|<|>/.test(v);
    if (isPlaceholder(url) || isPlaceholder(key)) { this.reason = "CONFIG"; return false; }

    try {
      this.client = window.supabase.createClient(url, key, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storageKey: "remindly-auth"
        },
        realtime: { params: { eventsPerSecond: 10 } }
      });
      this.configured = true;
      this.reason = null;
      return true;
    } catch (e) {
      this.reason = "CONFIG";
      return false;
    }
  },

  /** The authenticated user id — always taken from Supabase Auth, never from
   *  client state or the URL. RLS is the authoritative guard. */
  async authedUserId() {
    if (!this.configured) return null;
    const { data, error } = await this.client.auth.getSession();
    if (error || !data || !data.session) return null;
    return data.session.user.id;
  }
};

/* ============================================================ local extras
   Four UX-only fields (colour marker, completed timestamp, notification
   memory, snooze state) have no column in public.reminders yet. They are kept
   per device so nothing breaks. Add the optional columns from the header
   comment to sync them too. */
const extra = {
  read(uid) {
    if (!uid) return {};
    try { return JSON.parse(localStorage.getItem(K.extra(uid)) || "{}"); }
    catch (e) { return {}; }
  },
  write(uid, map) {
    try { localStorage.setItem(K.extra(uid), JSON.stringify(map || {})); } catch (e) { }
  },
  patch(uid, id, patch) {
    if (!uid || !id) return;
    const map = this.read(uid);
    map[id] = { ...(map[id] || {}), ...patch };
    this.write(uid, map);
  },
  drop(uid, id) {
    const map = this.read(uid);
    delete map[id];
    this.write(uid, map);
  }
};

/* ============================================================ field mapping
   app field  ->  public.reminders column
     id            id              (database generated)
     userId        user_id         (from Supabase Auth + RLS)
     title         title
     notes         description
     date          reminder_date   (YYYY-MM-DD)
     time          reminder_time   (HH:MM)
     category      category
     priority      priority
     completed     completed
     repeat        repeat_type     (none|daily|weekdays|weekly|monthly|every-N-unit)
     custom        repeat_type     (encoded as "every-N-unit")
     notify        notification_enabled
     createdAt     created_at
     updatedAt     updated_at
*/
function encodeRepeat(r) {
  if (r.repeat === "custom") {
    const c = r.custom || { every: 1, unit: "days" };
    const unit = ["days", "weeks", "months"].includes(c.unit) ? c.unit : "days";
    return `every-${clamp(Number(c.every) || 1, 1, 365)}-${unit}`;
  }
  return r.repeat || "none";
}
function decodeRepeat(v) {
  const m = /^every-(\d+)-(days|weeks|months)$/.exec(String(v || ""));
  if (m) return { repeat: "custom", custom: { every: Number(m[1]), unit: m[2] } };
  const known = ["none", "daily", "weekdays", "weekly", "monthly"];
  return { repeat: known.includes(v) ? v : "none", custom: { every: 1, unit: "days" } };
}
function mapToRow(r, uid, includeUser = true) {
  const row = {
    title: r.title || "Untitled reminder",
    description: r.notes || null,
    reminder_date: r.date,
    reminder_time: String(r.time || "09:00").slice(0, 5),
    category: CATS.includes(r.category) ? r.category : "Other",
    priority: ["low", "medium", "high", "urgent"].includes(r.priority) ? r.priority : "medium",
    completed: !!r.completed,
    repeat_type: encodeRepeat(r),
    notification_enabled: r.notify !== false,
    updated_at: new Date().toISOString()
  };
  if (includeUser) row.user_id = uid;
  return row;
}
function rowToReminder(row, uid) {
  const rep = decodeRepeat(row.repeat_type);
  const x = extra.read(row.user_id || uid)[String(row.id)] || {};
  return {
    id: String(row.id),
    userId: row.user_id || uid,
    title: row.title || "Untitled reminder",
    notes: row.description || "",
    date: row.reminder_date,
    time: String(row.reminder_time || "09:00").slice(0, 5),
    repeat: rep.repeat,
    custom: rep.custom,
    priority: row.priority || "medium",
    category: CATS.includes(row.category) ? row.category : "Other",
    color: x.color ?? null,
    notify: row.notification_enabled !== false,
    completed: !!row.completed,
    completedAt: x.completedAt ?? (row.completed ? (row.updated_at || new Date().toISOString()) : null),
    notifiedFor: x.notifiedFor ?? null,
    snoozeUntil: x.snoozeUntil ?? null,
    snoozeCount: x.snoozeCount ?? 0,
    createdAt: row.created_at || new Date().toISOString(),
    updatedAt: row.updated_at || new Date().toISOString(),
    _pending: false,
    _failed: false
  };
}

  /* ---------------- helpers ---------------- */
  fromSupabaseUser(u) {
    const meta = u.user_metadata || {};
    const name = String(meta.display_name || (u.email ? u.email.split("@")[0] : "Friend")).trim();
    return {
      id: u.id,
      email: u.email || null,
      displayName: name || "Friend",
      avatar: meta.avatar && typeof meta.avatar === "object"
        ? meta.avatar
        : { type: "initials", color: AVATAR_COLORS[Math.abs((u.id || "x").charCodeAt(0)) % AVATAR_COLORS.length] },
      prefs: { ...DEFAULT_PREFS, ...(meta.prefs && typeof meta.prefs === "object" ? meta.prefs : {}) },
      onboarded: meta.onboarded !== false

  applySession(session) {

    if (!password) errs.password = "Please choose a password.";
