/* ============================================================ reminder form */
let lastCreatedId = null;

function defaultTime() {
  const d = new Date();
  d.setMinutes(d.getMinutes() + Number(store.prefs.duration || 30));
  return `${pad(d.getHours())}:${pad(Math.round(d.getMinutes() / 5) * 5 % 60)}`;
}

function openReminderForm(existing, preset) {
  const isEdit = Boolean(existing);
  const r = existing ? { ...existing, custom: { ...(existing.custom || {}) } } : makeReminder({
    id: "tmp_" + rid(),
    date: preset?.date || ymd(new Date()),
    time: preset?.time || defaultTime()
  });

  const html = `
    <div class="modal-head">
      <h2>${isEdit ? "Edit reminder" : "New reminder"}</h2>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="fTitle">Reminder title</label>
        <input class="input" id="fTitle" maxlength="120" placeholder="e.g. Study Maths" value="${esc(isEdit ? r.title : "")}">
      </div>

      <div class="field">
        <label for="fNotes">Description / notes</label>
        <textarea class="input" id="fNotes" maxlength="1000" placeholder="Add anything that helps — location, links, a short checklist.">${esc(r.notes)}</textarea>
      </div>

      <div class="form-2">
        <div class="field"><label for="fDate">Date</label><input class="input" id="fDate" type="date" value="${r.date}"></div>
        <div class="field"><label for="fTime">Time</label><input class="input" id="fTime" type="time" value="${r.time}"></div>
      </div>

      <div class="field">
        <label>Repeat</label>
        <div class="opt-row" id="fRepeat">
          ${[["none", "Doesn't repeat"], ["daily", "Every day"], ["weekdays", "Weekdays"], ["weekly", "Every week"], ["monthly", "Every month"], ["custom", "Custom"]]
      .map(([k, l]) => `<button type="button" class="opt ${r.repeat === k ? "active" : ""}" data-val="${k}">${l}</button>`).join("")}
        </div>
      </div>

      <div class="form-2" id="customWrap" style="${r.repeat === "custom" ? "" : "display:none"}">
        <div class="field"><label for="fEvery">Every</label><input class="input" id="fEvery" type="number" min="1" max="365" value="${r.custom?.every || 1}"></div>
        <div class="field">
          <label for="fUnit">Unit</label>
          <select class="input" id="fUnit">
            ${["days", "weeks", "months"].map(u => `<option value="${u}" ${(r.custom?.unit || "days") === u ? "selected" : ""}>${u.charAt(0).toUpperCase() + u.slice(1)}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="field">
        <label>Priority</label>
        <div class="opt-row" id="fPriority">
          ${[["low", "Low"], ["medium", "Medium"], ["high", "High"], ["urgent", "Urgent"]]
      .map(([k, l]) => `<button type="button" class="opt ${r.priority === k ? "active" : ""}" data-val="${k}">${l}</button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Category</label>
        <div class="opt-row" id="fCategory">
          ${CATS.map(c => `<button type="button" class="opt ${r.category === c ? "active" : ""}" data-val="${c}"><span class="sw" style="background:${CAT_COLOR[c]}"></span>${c}</button>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Colour marker (optional)</label>
        <div class="opt-row" id="fColor">
          ${Object.entries(CAT_COLOR).map(([name, hex]) => `
            <button type="button" class="opt ${r.color === hex ? "active" : ""}" data-val="${hex}" aria-label="${name}"><span class="sw" style="background:${hex};width:15px;height:15px"></span></button>`).join("")}
          <button type="button" class="opt ${!r.color ? "active" : ""}" data-val="">Auto</button>
        </div>
      </div>

      <div class="set-row" style="padding-bottom:0;border-bottom:0">
        <div class="rt"><b>Notification</b><span>Alert me when this reminder is due, with Complete and Snooze actions.</span></div>
        <div class="rc"><button type="button" class="switch" id="fNotify" role="switch" aria-checked="${r.notify}" aria-label="Notification"></button></div>
      </div>
    </div>
    <div class="modal-foot">
      ${isEdit ? `<button class="btn btn-ghost" data-act="delete-from-form">${ICON.trash} Delete</button>` : ""}
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-act="save">${isEdit ? "Save changes" : "Create reminder"}</button>
    </div>`;

  ui.openModal(html, {
    wide: true,
    onMount(modal, close) {
      const state = { repeat: r.repeat, priority: r.priority, category: r.category, color: r.color || "", notify: r.notify };

      const group = (sel, key, after) => {
        const wrap = modal.querySelector(sel);
        wrap.addEventListener("click", e => {
          const b = e.target.closest(".opt");
          if (!b) return;
          wrap.querySelectorAll(".opt").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          state[key] = b.dataset.val;
          if (after) after();
        });
      };
      group("#fRepeat", "repeat", () => {
        modal.querySelector("#customWrap").style.display = state.repeat === "custom" ? "" : "none";
      });
      group("#fPriority", "priority");
      group("#fCategory", "category");
      group("#fColor", "color");

      const notifyBtn = modal.querySelector("#fNotify");
      notifyBtn.addEventListener("click", () => {
        state.notify = notifyBtn.getAttribute("aria-checked") !== "true";
        notifyBtn.setAttribute("aria-checked", String(state.notify));
      });

      modal.addEventListener("click", async e => {
        const act = e.target.closest("[data-act]")?.dataset.act;

        if (act === "delete-from-form") {
          close();
          await deleteReminder(existing.id);
          return;
        }
        if (act !== "save") return;

        const title = modal.querySelector("#fTitle").value.trim();
        const date = modal.querySelector("#fDate").value;
        const time = modal.querySelector("#fTime").value;

        if (!title) { modal.querySelector("#fTitle").focus(); ui.toast("Please add a reminder title", "warn"); return; }
        if (!date || Number.isNaN(parseYmd(date).getTime())) { modal.querySelector("#fDate").focus(); ui.toast("Please choose a valid date", "warn"); return; }
        if (!time || !/^\d{2}:\d{2}$/.test(time)) { modal.querySelector("#fTime").focus(); ui.toast("Please choose a valid time", "warn"); return; }

        const payload = {
          title,
          notes: modal.querySelector("#fNotes").value.trim(),
          date, time,
          repeat: state.repeat,
          custom: {
            every: clamp(Number(modal.querySelector("#fEvery")?.value || 1), 1, 365),
            unit: modal.querySelector("#fUnit")?.value || "days"
          },
          priority: state.priority,
          category: state.category,
          color: state.color || null,
          notify: state.notify,
          notifiedFor: null,
          snoozeUntil: null
        };

        const btn = modal.querySelector('[data-act="save"]');
        btn.classList.add("btn-loading");
        btn.disabled = true;

        if (isEdit) {
          const saved = await store.update(existing.id, payload);
          btn.classList.remove("btn-loading");
          btn.disabled = false;
          if (!saved || saved._failed) return;   // keep the form open on failure
          close();
          render();
        } else {
          const nr = await store.add(makeReminder({ ...payload, userId: auth.user.id }));
          btn.classList.remove("btn-loading");
          btn.disabled = false;
          if (!nr) return;                       // keep the form open on failure
          lastCreatedId = nr.id;
          notif.chime();
          close();
          render();
        }
      });

      setTimeout(() => modal.querySelector("#fTitle")?.focus(), 40);
    }
  });
}

async function deleteReminder(id) {
  const r = store.get(id);
  if (!r) return;
  const ok = await ui.confirm({
    title: `Delete “${r.title}”?`,
    body: "This reminder will be removed permanently from your account. This cannot be undone.",
    confirmLabel: "Delete reminder",
    danger: true
  });
  if (!ok) return;
  await store.remove(id);
  render();
}

async function toggleReminder(id) {
  const r = store.get(id);
  if (!r) return;

  if (r.completed) {
    await store.update(id, { completed: false, completedAt: null, notifiedFor: null, snoozeUntil: null });
    render();
    return;
  }

  if (r.repeat && r.repeat !== "none") {
    const next = sched.advance(r);
    if (next) {
      await store.update(id, { ...next, completed: false, completedAt: null });
      ui.toast(`Completed · next on ${format.shortDate(parseYmd(next.date))}`);
      render();
      return;
    }
  }

  await store.update(id, { completed: true, completedAt: new Date().toISOString(), snoozeUntil: null });
  notif.chime();
  render();
}

function openAssistant(prefill) {
  const html = `

      <div class="field">
        <label for="aiInput">Your reminder</label>
        <textarea class="input" id="aiInput" rows="3" placeholder="Remind me to study Maths tomorrow at 6 PM.">${esc(prefill || "")}</textarea>
      </div>
      <div class="opt-row">
        <button type="button" class="opt" data-sample="Remind me to study Maths tomorrow at 6 PM.">Study Maths tomorrow</button>
        <button type="button" class="opt" data-sample="Remind me every Monday at 5 PM to work on my website.">Weekly website work</button>
        <button type="button" class="opt" data-sample="Pay subscription on the 1st of every month at 9 AM, urgent.">Monthly subscription</button>
      </div>
      <div id="aiResult"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" data-act="parse">${ICON.sparkle} Understand reminder</button>
    </div>`;

  ui.openModal(html, {
    wide: true,
    onMount(modal, close) {
      let candidate = null;
      const result = modal.querySelector("#aiResult");
      const input = modal.querySelector("#aiInput");

      const showPreview = c => {
        candidate = c;
        result.innerHTML = `
          <div class="ai-preview">
            <div class="pv"><div class="k">Task</div><div class="v">${esc(c.title)}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Date</div><div class="v">${esc(format.fullDate(parseYmd(c.date)))}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Time</div><div class="v">${esc(format.time(c.time))}<span class="ai-tag">extracted</span></div></div>
            <div class="pv"><div class="k">Category</div><div class="v">${chipCat(c.category)}<span class="ai-tag">suggested</span></div></div>
            <div class="pv"><div class="k">Priority</div><div class="v">${chipPrio(c.priority)}<span class="ai-tag">suggested</span></div></div>
            <div class="pv"><div class="k">Repeat</div><div class="v">${esc(format.repeatLabel(c))}</div></div>
          </div>
          <div style="display:flex;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap">
            <button class="btn btn-primary inline" data-act="create">${ICON.check} Create reminder</button>
            <button class="btn btn-ghost inline" data-act="edit-details">${ICON.edit} Edit details</button>
          </div>`;
      };

      modal.addEventListener("click", async e => {
        const sample = e.target.closest("[data-sample]");
        if (sample) { input.value = sample.dataset.sample; input.focus(); return; }

        const act = e.target.closest("[data-act]")?.dataset.act;

        if (act === "parse") {
          const text = input.value.trim();
          if (!text) { input.focus(); ui.toast("Type a reminder first", "warn"); return; }
          const c = ai.parse(text);
          if (!c.ok) { ui.toast("I couldn't find a task in that", "warn"); return; }
          showPreview(c);
          return;
        }

        if (act === "create" && candidate) {
          const nr = await store.add(makeReminder({ ...candidate, userId: auth.user.id }));
          if (!nr) return;
          lastCreatedId = nr.id;
          notif.chime();
          close();
          render();
          return;
        }

        if (act === "edit-details" && candidate) {
          close();
          openReminderForm(null, { date: candidate.date, time: candidate.time });
          setTimeout(() => {
            const t = $("#fTitle");
            if (t) t.value = candidate.title;
          }, 60);
        }
      });

      modal.addEventListener("keydown", e => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          e.preventDefault();
          modal.querySelector("[data-act='parse']").click();
        }
      });

      setTimeout(() => input.focus(), 40);
    }
  });
}

    app: "remindly", v: 2, exportedAt: new Date().toISOString(),
    account: { id: auth.user.id, email: auth.user.email, displayName: auth.user.displayName },
    reminders: store.reminders.filter(r => r.userId === auth.user.id),
    prefs: store.prefs
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `remindly-export-${ymd(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  ui.toast("Reminders exported.");
}

function handleImport(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data) ? data : data.reminders;
      if (!Array.isArray(incoming)) throw new Error("bad shape");
      const cleaned = incoming.filter(r => r && r.title && r.date && r.time);
      for (const r of cleaned) {
        await store.add(makeReminder({
          title: r.title, notes: r.notes || "", date: r.date, time: r.time,
          repeat: r.repeat || "none", custom: r.custom || { every: 1, unit: "days" },
          priority: r.priority || "medium", category: r.category || "Other",
          notify: r.notify !== false, userId: auth.user.id
        }));
      }
      ui.toast(`${cleaned.length} reminder${cleaned.length === 1 ? "" : "s"} imported.`);
      render();
    } catch (err) {
      ui.toast("That file couldn't be read.", "warn");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
}

/* ============================================================ account menu */
function toggleAccountMenu(force) {
  const wrap = $("#acct");
  const existing = wrap.querySelector(".dropdown");
  const open = force !== undefined ? force : !existing;
  if (existing) existing.remove();
  $("#acctBtn").setAttribute("aria-expanded", String(open));
  if (!open) return;

  const dd = document.createElement("div");
  dd.className = "dropdown";
  dd.setAttribute("role", "menu");
  dd.innerHTML = `
    <div class="dd-head">
      <b>${esc(auth.user.displayName)}</b>
      <div class="t-caption">${esc(auth.user.email || "Guest session")}</div>
    </div>
    <button class="dd-item" data-go="profile" role="menuitem">${ICON.user} Profile</button>
    <button class="dd-item" data-go="settings" role="menuitem">${ICON.gear} Settings</button>
    <button class="dd-item" data-act="open-notifications" role="menuitem">${ICON.bell} Notifications</button>
    <button class="dd-item" data-act="help" role="menuitem">${ICON.help} Help</button>
    <div class="dd-sep"></div>
    <button class="dd-item danger" data-act="logout" role="menuitem">${ICON.logout} Log out</button>`;
  wrap.appendChild(dd);

  dd.addEventListener("click", e => {
    const go = e.target.closest("[data-go]")?.dataset.go;
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (go) { toggleAccountMenu(false); router.go(go); }
    if (act) { toggleAccountMenu(false); handleAction(act, e.target.closest("[data-act]")); }
  });
}

document.addEventListener("click", e => {
  if (!e.target.closest("#acct")) toggleAccountMenu(false);
});

/* ============================================================ action bus */
async function handleAction(act, actEl) {
  const card = actEl.closest(".rcard");
  const id = actEl.dataset.id || (card && card.dataset.id);

  switch (act) {
    case "add": openReminderForm(null); break;
    case "assistant": openAssistant(); break;
    case "help": openHelp(); break;
    case "open-notifications": $("#btnBell").click(); break;
    case "open-reminders": router.go("reminders"); break;
    case "open-completed": router.go("completed"); break;
    case "view-overdue":
      store.ui.filter = "overdue";
      router.go("reminders");
      break;
    case "samples": await store.loadSamples(); break;
    case "retry-load": await store.init(); render(); break;
    case "add-on-date":
      openReminderForm(null, { date: store.ui.calDay || ymd(new Date()) });
      break;
    case "toggle": if (id) await toggleReminder(id); break;
    case "restore": if (id) await toggleReminder(id); break;
    case "edit": if (id) openReminderForm(store.get(id)); break;
    case "delete": if (id) await deleteReminder(id); break;
    case "more": if (card) card.classList.toggle("open"); break;

    case "clear-completed": {
      const n = store.reminders.filter(r => r.completed).length;
      if (!n) { ui.toast("Nothing to clear", "info"); break; }
      const ok = await ui.confirm({
        title: `Clear ${n} completed reminder${n === 1 ? "" : "s"}?`,
        body: "Completed reminders will be removed permanently from your account.",
        confirmLabel: "Clear completed",
        danger: true
      });
      if (ok) { await store.clearCompleted(); render(); }
      break;
    }

    case "cal-prev": {
      const d = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date();
      d.setMonth(d.getMonth() - 1);
      store.ui.calMonth = ymd(d);
      render();
      break;
    }
    case "cal-next": {
      const d = store.ui.calMonth ? parseYmd(store.ui.calMonth) : new Date();
      d.setMonth(d.getMonth() + 1);
      store.ui.calMonth = ymd(d);
      render();
      break;
    }
    case "cal-today":
      store.ui.calMonth = ymd(new Date());
      store.ui.calDay = ymd(new Date());
      render();
      break;
    case "cal-day":
      store.ui.calDay = actEl.dataset.day;
      render();
      break;

    case "avatar-color":
      await auth.updateProfile({ avatar: { type: "initials", color: actEl.dataset.color } });
      ui.toast("Avatar updated.");
      render();
      break;
    case "avatar-upload":
      $("#avatarFile")?.click();
      break;
    case "change-password":
      if (auth.mode === "guest") { ui.toast("Create an account to secure it with a password", "info"); break; }
      openChangePassword();
      break;

    case "logout": {
      const ok = await ui.confirm({
        title: "Log out of Remindly?",
        body: "Your reminders stay safe in your account and will be here when you return.",
        confirmLabel: "Log out"
      });
      if (!ok) break;
      await auth.logOut();
      ui.toast("You've been logged out.", "info");
      router.go("landing");
      break;
    }

    case "theme":
      applyTheme(actEl.dataset.theme);
      render();
      break;
    case "timeformat":
      store.prefs.timeFormat = actEl.dataset.fmt;
      await store.persist();
      ui.toast(`Time format set to ${actEl.dataset.fmt} hour.`);
      render();
      break;
    case "toggle-pref": {
      const key = actEl.dataset.pref;
      store.prefs[key] = !store.prefs[key];
      actEl.setAttribute("aria-checked", String(store.prefs[key]));
      await store.persist();
      if (key === "sound" && store.prefs.sound) notif.chime();
      ui.toast(`${key === "sound" ? "Sound" : "Notifications"} ${store.prefs[key] ? "enabled" : "disabled"}.`);
      break;
    }
    case "ask-permission": {
      const res = await notif.request();
      ui.toast(res === "granted" ? "Browser notifications enabled." : "Notification permission not granted.", res === "granted" ? "ok" : "warn");
      render();
      break;
    }
    case "test-notification":
      notif.browser("Remindly", "Notifications are working correctly.");
      ui.toast("Test notification sent.", "info");
      break;
    case "export": exportReminders(); break;
    case "import": $("#importFile")?.click(); break;
    default: break;
  }
}

/* ============================================================ global events */
document.addEventListener("click", async e => {
  const goBtn = e.target.closest("[data-go]");
  if (goBtn && !goBtn.closest(".dropdown")) {
    e.preventDefault();
    const target = goBtn.dataset.go;
    if (target === "guest") {
      auth.enterGuest();
      await store.init();
      applyTheme(store.prefs.theme);
      ui.toast("Welcome — you're using Remindly as a guest.", "info");
      router.go("dashboard");
      return;
    }
    if (target === "google") {
      if (!sb.configured) {
        ui.toast("Connect Supabase first — Google sign-in is provided by Supabase Auth.", "warn");
        return;
      }
      const { error } = await sb.client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: location.origin + location.pathname + "#/dashboard" }
      });
      if (error) ui.toast("Google sign-in isn't enabled on this project yet. Email and password still work.", "warn");
      return;
    }
    router.go(target);
    return;
  }

  if (e.target.closest("#acctBtn")) {
    toggleAccountMenu();
    return;
  }

  const navBtn = e.target.closest("[data-view]");
  if (navBtn && navBtn.dataset.view) {
    router.go(navBtn.dataset.view);
    return;
  }

  const actEl = e.target.closest("[data-act]");
  if (!actEl) return;
  await handleAction(actEl.dataset.act, actEl);
});

document.addEventListener("click", e => {
  const eye = e.target.closest("[data-eye]");
  if (!eye) return;
  const input = document.getElementById(eye.dataset.eye);
  if (!input) return;
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  eye.innerHTML = show ? ICON.eyeOff : ICON.eye;
  eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

$("#btnTheme").addEventListener("click", () => {
  applyTheme(store.prefs.theme === "dark" ? "light" : "dark");
  render();
});
$("#btnAssistant").addEventListener("click", () => openAssistant());
$("#fab").addEventListener("click", () => openReminderForm(null));

$("#btnBell").addEventListener("click", () => {
  const pending = store.reminders
    .filter(r => r.userId === auth.user.id && !r.completed && sched.effective(r) <= Date.now() + 3600000 * 24)
    .sort((a, b) => sched.effective(a) - sched.effective(b));

  const html = `
    <div class="modal-head">
      <h2>Notifications</h2>
      <button class="icon-btn" data-close aria-label="Close">${ICON.close}</button>
    </div>
    <div class="modal-body">
      ${pending.length ? `<div class="list">${pending.slice(0, 8).map(reminderCard).join("")}</div>`
      : emptyState({ icon: ICON.bell, title: "You're all caught up", body: "Nothing is due in the next 24 hours.", action: "add", actionLabel: "Add reminder" })}
      <div class="note">
        ${ICON.info}
        <div>Reminders fire while Remindly is open in a tab. Keep the tab open or pinned for time-critical alerts — a fully closed tab cannot be woken by the browser.</div>
      </div>
    </div>
    <div class="modal-foot">
      ${notif.permission() === "default" && !store.prefs.permissionAsked ? `<button class="btn btn-ghost" data-act="ask-permission">Enable browser notifications</button>` : ""}
      <button class="btn btn-primary" data-close>Close</button>
    </div>`;

  ui.openModal(html, {
    onMount(modal) {
      modal.addEventListener("click", async ev => {
        if (ev.target.closest("[data-act='ask-permission']")) {
          const res = await notif.request();
          ui.toast(res === "granted" ? "Browser notifications enabled." : "Permission not granted.", res === "granted" ? "ok" : "warn");
        }
      });
    }
  });
});

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;

  if (e.key === "Escape") {
    const open = $("#modalRoot .overlay");
    if (open) { open.remove(); return; }
    const dd = $(".dropdown");
    if (dd) { toggleAccountMenu(false); return; }
    const card = $(".rcard.open");
    if (card) card.classList.remove("open");
    return;
  }

  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!router.isApp()) return;

  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); openReminderForm(null); }
  else if (k === "a") { e.preventDefault(); openAssistant(); }
  else if (k === "t") { e.preventDefault(); applyTheme(store.prefs.theme === "dark" ? "light" : "dark"); render(); }
  else if (k === "/") {
    e.preventDefault();
    if (router.route !== "reminders") { router.go("reminders"); setTimeout(() => $("#searchInput")?.focus(), 60); }
    else $("#searchInput")?.focus();
  }
  else if (k === "1") router.go("dashboard");
  else if (k === "2") router.go("reminders");
  else if (k === "3") router.go("calendar");
  else if (k === "4") router.go("completed");
  else if (k === "5") router.go("settings");
});

/* ============================================================ clock */
function tickClock() {
  const now = new Date();
  const c = $("#clock");
  const cd = $("#clockDate");
  if (c) c.textContent = format.timeFromDate(now);
  if (cd) cd.textContent = `${DAYS[now.getDay()]} ${now.getDate()} ${MONTHS_S[now.getMonth()]}`;
}
function tickCountdowns() {
  $$(".js-countdown").forEach(el => {
    const until = el.dataset.until;
    if (!until) return;
    const txt = el.querySelector(".cd-text") || el;
    txt.textContent = format.countdown(new Date(until));
  });
}

/* ============================================================ theming */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  store.prefs.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#101211" : "#F4F5F2");
  const icon = $("#themeIcon");
  if (icon) {
    icon.innerHTML = theme === "dark"
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2.6v2M12 19.4v2M21.4 12h-2M4.6 12h-2M18.6 5.4 17.2 6.8M6.8 17.2 5.4 18.6M18.6 18.6 17.2 17.2M6.8 6.8 5.4 5.4"/>'
      : '<path d="M20.5 14.2A8.4 8.4 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2"/>';
  }
  if (auth.user) store.persist();
}

/* ============================================================ session boot */
async function bootSession(opts = {}) {
  appState.showNetwork("syncing");
  await store.init();
  applyTheme(store.prefs.theme || "light");
  realtime.start(auth.user.id);

  const from = router.params.from;
  const target = from && VIEW_TITLES[from] ? from : (auth.user.onboarded ? "dashboard" : "onboarding");
  router.go(target);

  if (dbStatus().connected && navigator.onLine) {
    setTimeout(() => appState.showNetwork("synced"), 600);
  } else {
    appState.showNetwork("clear");
  }
}

function dbStatus() {
  return { connected: sb.configured };
}

/* ============================================================ boot */
(async function boot() {
  await sb.loadSDK();
  sb.init();

  if (!store.ui) store.ui = { filter: "all", query: "", sort: "time", calMonth: null, calDay: null };

  const restored = await auth.restore();
  auth.listen();
  router.read();

  if (restored) {
    await store.init();
    applyTheme(store.prefs.theme || "light");
    realtime.start(auth.user.id);
    if (router.route === "login" || router.route === "landing" || router.route === "signup" || router.route === "forgot") {
      router.go(auth.user.onboarded ? "dashboard" : "onboarding");
    } else {
      render();
    }
    if (dbStatus().connected && navigator.onLine) appState.showNetwork("syncing");
  } else {
    if (["login", "signup", "forgot", "reset", "onboarding"].includes(router.route)) render();
    else { router.go("landing", { replace: true }); }
    render();
  }

  tickClock();
  setInterval(tickClock, 30000);
  setInterval(tickCountdowns, 1000);
  notif.start();

  setInterval(() => {
    if (router.isApp() && router.route === "dashboard" && !$("#modalRoot .overlay") && document.visibilityState === "visible") render();
    updateBadge();
    appState.check();
  }, 60000);

  window.addEventListener("focus", () => {
    appState.check();
    if (router.isApp() && document.visibilityState === "visible") render();
  });
  window.addEventListener("online", () => {
    appState.check();
    if (dbStatus().connected) {
      appState.showNetwork("syncing");
      store.refresh();
      setTimeout(() => appState.showNetwork("synced"), 900);
    }
  });
  window.addEventListener("offline", () => appState.check());
  window.addEventListener("hashchange", () => { router.read(); render(); });

  // "Remember me" unchecked -> sign out when the tab closes.
  window.addEventListener("pagehide", () => {
    if (sessionStorage.getItem(K.temporary) === "1" && auth.mode === "user") {
      try { sb.configured && sb.client.auth.signOut(); } catch (e) { }
    }
  });

  const highlight = () => {
    if (!lastCreatedId) return;
    const el = document.querySelector(`.rcard[data-id="${lastCreatedId}"], .rail-node[data-id="${lastCreatedId}"]`);
    if (el && !reduceMotion()) {
      el.classList.add("sweep");
      setTimeout(() => el.classList.remove("sweep"), 620);
    }
    lastCreatedId = null;
  };
  new MutationObserver(highlight).observe(document.body, { childList: true, subtree: true });

  setTimeout(() => {
    const s = $("#splash");
    if (s) { s.classList.add("out"); setTimeout(() => s.remove(), 400); }
  }, 420);
})();
</script>
